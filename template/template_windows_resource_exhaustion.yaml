zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 1d9c5416b33343fa94a09c66b4ed9e22
      name: Templates/Operating systems
  templates:
    - uuid: 66dc4a2b623142faad3d97af8561ff1c
      template: Windows resource exhaustion by Zabbix agent active
      name: Windows resource exhaustion by Zabbix agent active
      description: |
        Исчерпание ресурсов Windows — сокетов, дескрипторов, пула ядра — с привязкой к процессу.

        Показывает, какой процесс на машине расходует что. Только стандартные ключи агента (wmi.getall, wmi.get,
        perf_counter_en, eventlog): конфигурацию агента менять не нужно, UserParameter не используется.

        Что собирается:
        - TCP-сокеты по состояниям из MSFT_NetTCPConnection, включая Bound: их не показывают ни netstat без -q,
          ни net.tcp.socket.count;
        - пять процессов с наибольшим числом сокетов Bound и CLOSE_WAIT — для operational data в алертах;
        - динамический диапазон портов, каким его видит Windows, и число свободных портов в нём;
        - дескрипторы: всего в системе, у самого занятого процесса, пять самых занятых в виде «имя (PID n)=число»;
        - пул ядра, невыгружаемый и выгружаемый, в байтах и в доле RAM;
        - события Windows 4231 (эфемерных портов не осталось) и 4227 (локальная точка переиспользуется слишком
          быстро).

        Раз в {$WINEX.PROBE.INTERVAL} выполняются четыре WMI-запроса: сокеты, процессы, диапазон портов,
        объём памяти. Сырые таблицы сокетов и процессов не хранятся.

        Каждый триггер привязан к пределу: пул ядра в доле RAM, свободные порты в обнаруженном диапазоне,
        суточный минимум дескрипторов у самого занятого процесса, прогноз timeleft по портам и журнал событий.
        Один только рост тревоги не поднимает. Порог дескрипторов — единственное число, которое не выводится
        из данных хоста. Если на хосте законно работает крупный держатель, {$WINEX.HANDLES.CEILING}
        переопределяется на этом хосте.

        Триггер «нет данных» срабатывает, когда проба замолчала, а агент продолжает раз в минуту присылать
        счётчик пула ядра. Если недоступны агент, прокси или канал, счётчик тоже не приходит, и здесь ничего
        не срабатывает: этот случай сообщает стандартный шаблон.

        В алертах по сокетам указаны PID, имена процессов лежат в элементе «Процессы: имена по PID». Zabbix
        не умеет объединять два мастер-элемента.

        Требования:
        - Windows 8 / Server 2012 или новее (root\StandardCimv2 с MSFT_NetTCPConnection).
        - Zabbix agent или agent 2 версии 7.0 или новее. Агенты старше не применяют таймаут элемента
          к активной проверке.
        - Все элементы — активные проверки: ServerActive указывает на сервер или прокси, Hostname совпадает
          с именем хоста в Zabbix.
        - Шаблон привязывается вместе со стандартным «Windows by Zabbix agent active». О мёртвом агенте
          и неверном ServerActive сообщает только он: триггеры «нет данных» здесь срабатывают, пока агент жив.
        - У winex.handles.max хранится история не меньше 24 часов: порог дескрипторов читает суточный минимум.
        - {$WINEX.WMI.TIMEOUT} равен 30s, это максимум Zabbix. MSFT_NetTCPConnection тратит около 4–5 мс
          на соединение, поэтому проба сокетов перестаёт укладываться в таймаут примерно на 6000–7000
          соединений. На таком хосте процесс, который их держит, указан в последнем успешном
          winex.sock.bound.top.
        - {$WINEX.NODATA.PERIOD} не меньше трёх {$WINEX.PROBE.INTERVAL}.

        Author:  Konstantin Tyutyunnik / Константин Тютюнник
        Site:    https://itforprof.com
        Repo:    https://github.com/IT-for-Prof/zabbix-windows-exhaustion
        License: MIT (c) 2026 Konstantin Tyutyunnik
      vendor:
        name: itforprof.com
        version: 1.6.0
      groups:
        - name: Templates/Operating systems
      items:
        - uuid: 865e40f31d4a4dbea7082f5a57214b24
          name: 'Сокеты: WMI-проба'
          key: 'wmi.getall[root\standardcimv2,"SELECT State,OwningProcess FROM MSFT_NetTCPConnection"]'
          type: ZABBIX_ACTIVE
          delay: '{$WINEX.PROBE.INTERVAL}'
          timeout: '{$WINEX.WMI.TIMEOUT}'
          history: '0'
          trends: '0'
          value_type: TEXT
          description: |
            Сырая таблица сокетов, около 60 байт на сокет.
            История 0: поле истории обрезается на 65535 байтах, а предобработка получает значение целиком.
            Локальный порт берётся из InstanceID: WMI возвращает его, даже если поля нет в SELECT.
          tags:
            - tag: component
              value: network
            - tag: scope
              value: capacity
        - uuid: bf79fa9a74ff4e5b9ad0139a7af6c530
          name: 'Процессы: WMI-проба'
          key: 'wmi.getall[root\cimv2,"SELECT Name,ProcessId,HandleCount FROM Win32_Process"]'
          type: ZABBIX_ACTIVE
          delay: '{$WINEX.PROBE.INTERVAL}'
          timeout: '{$WINEX.WMI.TIMEOUT}'
          history: '0'
          trends: '0'
          value_type: TEXT
          description: 'Сырая таблица процессов. Из неё строятся элементы дескрипторов и имена по PID.'
          tags:
            - tag: component
              value: os
            - tag: scope
              value: capacity
        - uuid: 7e14c50bb6034fc6b6d2d85c63c5de5d
          name: 'Сокеты: сводка по состояниям'
          key: winex.sock.summary
          type: DEPENDENT
          history: '0'
          trends: '0'
          value_type: TEXT
          master_item:
            key: 'wmi.getall[root\standardcimv2,"SELECT State,OwningProcess FROM MSFT_NetTCPConnection"]'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  if (value.slice(-1) !== ']') throw 'truncated WMI payload, ' + value.length + ' bytes';
                  var a = JSON.parse(value);
                  var acc = {bound: {}, cw: {}};
                  var c = {total: a.length, listen: 0, established: 0, close_wait: 0, time_wait: 0, bound: 0};
                  for (var i = 0; i < a.length; i++) {
                    var st = Number(a[i].State), bucket = null;
                    if (st === 2) c.listen++;
                    else if (st === 5) c.established++;
                    else if (st === 8) { c.close_wait++; bucket = 'cw'; }
                    else if (st === 11) c.time_wait++;
                    else if (st === 100) { c.bound++; bucket = 'bound'; }
                    if (bucket) {
                      var p = String(a[i].OwningProcess);
                      acc[bucket][p] = (acc[bucket][p] || 0) + 1;
                    }
                  }
                  function top(o) {
                    var r = [];
                    for (var k in o) r.push([k, o[k]]);
                    r.sort(function (x, y) { return y[1] - x[1]; });
                    var out = [];
                    for (var i = 0; i < r.length && i < 5; i++) out.push('PID ' + r[i][0] + '=' + r[i][1]);
                    return out.length ? out.join(', ') : 'none';
                  }
                  c.bound_max = 0;
                  for (var k in acc.bound) if (acc.bound[k] > c.bound_max) c.bound_max = acc.bound[k];
                  c.bound_top = top(acc.bound);
                  c.cw_top = top(acc.cw);
                  return JSON.stringify(c);
          description: |
            За один проход по сырой таблице строятся все элементы сокетов: счётчики и списки процессов.
            Состояния: 2 Listen, 5 Established, 8 CloseWait, 11 TimeWait, 100 Bound. Состояния 100 нет в описании
            класса, это локальный порт, занятый без удалённой стороны.
          tags:
            - tag: component
              value: network
        - uuid: 153406683fb74e94a3be7694790c3061
          name: 'Сокеты: всего'
          key: winex.sock.total
          type: DEPENDENT
          value_type: UNSIGNED
          master_item:
            key: winex.sock.summary
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.total
          description: 'За ним следит триггер «Проба сокетов: нет данных». Значения нет, если проба сокетов не уложилась в таймаут или её ответ отброшен как обрезанный.'
          tags:
            - tag: component
              value: network
        - uuid: 2d4d185727424e3eb0925af32c314e3b
          name: 'Сокеты: установленные'
          key: winex.sock.established
          type: DEPENDENT
          value_type: UNSIGNED
          master_item:
            key: winex.sock.summary
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.established
          description: 'IPv4 и IPv6 вместе. Один счётчик \TCPv4\Connections Established на хосте с двумя стеками показывает меньше.'
          tags:
            - tag: component
              value: network
        - uuid: 6f0ebaf917294093a9bacc741904c08a
          name: 'Сокеты: CLOSE_WAIT'
          key: winex.sock.close_wait
          type: DEPENDENT
          value_type: UNSIGNED
          master_item:
            key: winex.sock.summary
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.close_wait
          tags:
            - tag: component
              value: network
        - uuid: 3cae3d123bdd4d5b9560b9c4824155d7
          name: 'Сокеты: TIME_WAIT'
          key: winex.sock.time_wait
          type: DEPENDENT
          value_type: UNSIGNED
          master_item:
            key: winex.sock.summary
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.time_wait
          tags:
            - tag: component
              value: network
        - uuid: 13630f1d76b34254b338234502ccdadc
          name: 'Сокеты: Bound'
          key: winex.sock.bound
          type: DEPENDENT
          value_type: UNSIGNED
          master_item:
            key: winex.sock.summary
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.bound
          description: 'Сокеты, которые заняли локальный порт без удалённой стороны. netstat без -q и net.tcp.socket.count их не показывают. Это число растёт, когда кончаются эфемерные порты.'
          tags:
            - tag: component
              value: network
            - tag: scope
              value: capacity
        - uuid: 07650ec21c13495887f06491e78976be
          name: 'Сокеты: Bound у самого занятого процесса'
          key: winex.sock.bound.max
          type: DEPENDENT
          value_type: UNSIGNED
          master_item:
            key: winex.sock.summary
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.bound_max
          description: 'Максимум по процессам. Рабочие процессы вроде httpd и svchost запускаются группами, и среднее спрятало бы один процесс с утечкой.'
          tags:
            - tag: component
              value: network
            - tag: scope
              value: capacity
        - uuid: 8b02ab54b91a4e66a3b3756ab016fe16
          name: 'Сокеты: процессы с наибольшим числом Bound'
          key: winex.sock.bound.top
          type: DEPENDENT
          value_type: TEXT
          master_item:
            key: winex.sock.summary
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.bound_top
          description: 'Пять процессов в виде «PID n=число», укладывается в 255 символов operational data. Имена процессов — в элементе «Процессы: имена по PID».'
          tags:
            - tag: component
              value: network
            - tag: scope
              value: capacity
        - uuid: 63e220ea507348b28c45a7ac6994261f
          name: 'Сокеты: процессы с наибольшим числом CLOSE_WAIT'
          key: winex.sock.close_wait.top
          type: DEPENDENT
          value_type: TEXT
          master_item:
            key: winex.sock.summary
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.cw_top
          description: 'Сокет остаётся в CLOSE_WAIT, когда удалённая сторона закрыла соединение, а локальное приложение так и не вызвало close(). Здесь указан PID этого приложения.'
          tags:
            - tag: component
              value: network
        - uuid: 000174cbe5f0478e846442b30bb9460f
          name: 'Порты: проба динамического диапазона'
          key: 'wmi.getall[root\standardcimv2,"SELECT DynamicPortRangeStartPort,DynamicPortRangeNumberOfPorts FROM MSFT_NetTCPSetting WHERE SettingName=''Internet''"]'
          type: ZABBIX_ACTIVE
          delay: '{$WINEX.PROBE.INTERVAL}'
          timeout: '{$WINEX.WMI.TIMEOUT}'
          history: 1d
          trends: '0'
          value_type: TEXT
          description: |
            Динамический диапазон портов, каким его видит Windows. Команда netsh int ipv4 set dynamicport tcp
            start=N num=M пишет его в недокументированное двоичное значение в HKLM\SYSTEM\CurrentControlSet\Control\Nsi,
            поэтому диапазон читается через WMI. MaxUserPort в Tcpip\Parameters Windows не учитывает со времён Vista.
          tags:
            - tag: component
              value: network
            - tag: scope
              value: capacity
        - uuid: 79dd9eebb9ed4b8d9bfd5e0749b21356
          name: 'Процессы: сводка по дескрипторам'
          key: winex.proc.handles
          type: DEPENDENT
          history: '0'
          trends: '0'
          value_type: TEXT
          master_item:
            key: 'wmi.getall[root\cimv2,"SELECT Name,ProcessId,HandleCount FROM Win32_Process"]'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  if (value.slice(-1) !== ']') throw 'truncated WMI payload, ' + value.length + ' bytes';
                  var a = JSON.parse(value), t = 0, r = [];
                  for (var i = 0; i < a.length; i++) {
                    var h = Number(a[i].HandleCount || 0);
                    t += h;
                    r.push([String(a[i].Name), Number(a[i].ProcessId), h]);
                  }
                  var byPid = r.slice();
                  byPid.sort(function (x, y) { return x[1] - y[1]; });
                  var map = [];
                  for (var i = 0; i < byPid.length; i++) map.push(byPid[i][1] + '=' + byPid[i][0]);
                  r.sort(function (x, y) { return y[2] - x[2]; });
                  var out = [];
                  for (var i = 0; i < r.length && i < 5; i++) out.push(r[i][0] + ' (PID ' + r[i][1] + ')=' + r[i][2]);
                  return JSON.stringify({total: t, max: r.length ? r[0][2] : 0, top: out.join(', '), map: map.join('  ')});
          description: 'За один проход по таблице процессов строятся все элементы дескрипторов и имена по PID. В Win32_Process есть имя процесса, поэтому список самых занятых читается без поиска по PID.'
          tags:
            - tag: component
              value: os
            - tag: scope
              value: capacity
        - uuid: cb4270630b77434eb73a912f5bf795ac
          name: 'Дескрипторы: всего'
          key: winex.handles.total
          type: DEPENDENT
          value_type: UNSIGNED
          master_item:
            key: winex.proc.handles
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.total
          description: 'За ним следит триггер «Проба процессов: нет данных».'
          tags:
            - tag: component
              value: os
            - tag: scope
              value: capacity
        - uuid: 96ff7ea363194823b12847b1d61a509a
          name: 'Дескрипторы: самый занятый процесс'
          key: winex.handles.max
          type: DEPENDENT
          value_type: UNSIGNED
          master_item:
            key: winex.proc.handles
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.max
          tags:
            - tag: component
              value: os
            - tag: scope
              value: capacity
        - uuid: feea6d138f34481897fe8c1719b7c0ce
          name: 'Дескрипторы: самые занятые процессы'
          key: winex.handles.top
          type: DEPENDENT
          value_type: TEXT
          master_item:
            key: winex.proc.handles
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.top
          description: 'Пять процессов в виде «имя (PID n)=число». Выводится в operational data алерта.'
          tags:
            - tag: component
              value: os
            - tag: scope
              value: capacity
        - uuid: c03d145e49ad48259c12f10121a72ff1
          name: 'Процессы: имена по PID'
          key: winex.proc.pidmap
          type: DEPENDENT
          history: 1d
          value_type: TEXT
          master_item:
            key: winex.proc.handles
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.map
          description: 'Отсортировано по PID, чтобы PID из алерта по сокетам находился глазами. Zabbix не умеет объединять два мастер-элемента, поэтому алерты по сокетам ссылаются сюда.'
          tags:
            - tag: component
              value: os
        - uuid: 7f380a61d7e64b9baff3a1d860503e67
          name: 'События Windows: локальная точка переиспользуется слишком быстро (4227)'
          key: 'eventlog[System,,,,^4227$,,skip]'
          type: ZABBIX_ACTIVE
          delay: 1m
          history: 7d
          value_type: LOG
          description: |
            Событие 4227: исходящее соединение отклонено, потому что его локальная точка недавно использовалась для
            того же удалённого адреса. Причина в одном приложении, которое слишком часто переподключается. Диапазон
            обычно почти свободен.
            Собирается отдельно от 4231: {ITEM.LOG.EVENTID} раскрывается только в оповещениях, и по одному общему
            элементу нельзя было бы понять, какое событие случилось. На здоровом хосте здесь пусто. eventlog[]
            работает только как активная проверка.
          tags:
            - tag: component
              value: network
            - tag: scope
              value: capacity
        - uuid: 7723f063cc3d45a7b4e6b3ba81e31d89
          name: 'События Windows: динамический диапазон портов исчерпан (4231)'
          key: 'eventlog[System,,,,^4231$,,skip]'
          type: ZABBIX_ACTIVE
          delay: 1m
          history: 7d
          value_type: LOG
          description: |
            Событие 4231: Windows не смогла выделить эфемерный порт, потому что заняты все порты динамического
            диапазона. Не зависит от обнаруженного диапазона, поэтому срабатывает, даже если подсчёт свободных портов
            ошибся. На здоровом хосте здесь пусто. eventlog[] работает только как активная проверка.
          tags:
            - tag: component
              value: network
            - tag: scope
              value: capacity
        - uuid: 42f710a1775f4141a66cb30c2db9931f
          name: 'Память: физическая, всего'
          key: 'wmi.get[root\cimv2,"SELECT TotalPhysicalMemory FROM Win32_ComputerSystem"]'
          type: ZABBIX_ACTIVE
          delay: '{$WINEX.PROBE.INTERVAL}'
          timeout: '{$WINEX.WMI.TIMEOUT}'
          value_type: FLOAT
          units: B
          description: |
            Знаменатель долей пула ядра. Читается через WMI, чтобы шаблон не зависел от элемента стандартного
            шаблона. Опрашивается с интервалом проб, хотя не меняется: на только что привязанном хосте доли пула
            не вычисляются, пока не придёт первое значение.
          tags:
            - tag: component
              value: memory
        - uuid: b68b5130bd2845b1bbb06b154ddb3555
          name: 'Пул ядра: невыгружаемый, доля RAM'
          key: winex.pool.nonpaged.pct
          type: CALCULATED
          history: 7d
          params: '100*avg(//perf_counter_en["\Memory\Pool Nonpaged Bytes",60],5m)/last(//wmi.get[root\cimv2,"SELECT TotalPhysicalMemory FROM Win32_ComputerSystem"])'
          delay: 1m
          trends: '0'
          value_type: FLOAT
          units: '%'
          description: |
            Невыгружаемый пул в доле физической памяти: на x64 его размер ограничен памятью. Порог в байтах
            оказался бы слишком тесным для большого хоста и слишком свободным для очень большого.
            В числителе среднее за 5 минут. last() продолжал бы возвращать последнее значение остановившегося
            счётчика, а avg() по пустому окну делает элемент неподдерживаемым, и об этом сообщает триггер
            «Доли пула ядра: нет данных». Тренды выключены: элемент читают только min() и nodata().
          tags:
            - tag: component
              value: memory
            - tag: scope
              value: capacity
        - uuid: 99acf6617f2e43fcb755e66bc889a377
          name: 'Пул ядра: выгружаемый, доля RAM'
          key: winex.pool.paged.pct
          type: CALCULATED
          history: 7d
          params: '100*avg(//perf_counter_en["\Memory\Pool Paged Bytes",60],5m)/last(//wmi.get[root\cimv2,"SELECT TotalPhysicalMemory FROM Win32_ComputerSystem"])'
          delay: 1m
          trends: '0'
          value_type: FLOAT
          units: '%'
          description: 'Выгружаемый пул в доле физической памяти. Устроен как невыгружаемая доля. Выгружаемый пул сильнее отличается у серверов разных ролей, поэтому его порог выше.'
          tags:
            - tag: component
              value: memory
            - tag: scope
              value: capacity
        - uuid: 2c7d8d456e014aceb4ec45375af616c9
          name: 'Пул ядра: невыгружаемый'
          key: 'perf_counter_en["\Memory\Pool Nonpaged Bytes",60]'
          type: ZABBIX_ACTIVE
          delay: 1m
          units: B
          description: 'Параметр усреднения 60 отличает этот ключ от ключа в стандартном шаблоне Windows. Без него два шаблона нельзя привязать к одному хосту.'
          tags:
            - tag: component
              value: memory
            - tag: scope
              value: capacity
        - uuid: d82f7c3e89d54704a9fea2808d0e1e6b
          name: 'Пул ядра: выгружаемый'
          key: 'perf_counter_en["\Memory\Pool Paged Bytes",60]'
          type: ZABBIX_ACTIVE
          delay: 1m
          units: B
          description: |
            Параметр 60 стоит по той же причине, что у невыгружаемого счётчика.
            По этому счётчику триггеры «нет данных» проверяют, что агент жив: он приходит раз в минуту и не зависит
            от WMI.
          tags:
            - tag: component
              value: memory
            - tag: scope
              value: capacity
      discovery_rules:
        - uuid: bf4f278194254ad7aa248a74cf018f27
          name: 'Обнаружение динамического диапазона портов'
          key: winex.ports.range.discovery
          type: DEPENDENT
          lifetime: 7d
          master_item:
            key: 'wmi.getall[root\standardcimv2,"SELECT DynamicPortRangeStartPort,DynamicPortRangeNumberOfPorts FROM MSFT_NetTCPSetting WHERE SettingName=''Internet''"]'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var a = JSON.parse(value);
                  if (!a.length) throw 'MSFT_NetTCPSetting returned no Internet setting';
                  var start = Number(a[0].DynamicPortRangeStartPort);
                  var num = Number(a[0].DynamicPortRangeNumberOfPorts);
                  if (!(start > 0 && start < 65536 && num > 0 && start % 1 === 0 && num % 1 === 0
                        && start + num <= 65536)) {
                    throw 'implausible dynamic port range: start=' + start + ' num=' + num;
                  }
                  return JSON.stringify([{start: start, num: num}]);
          lld_macro_paths:
            - lld_macro: '{#PORT_NUM}'
              path: $.num
            - lld_macro: '{#PORT_START}'
              path: $.start
          description: |
            Берёт динамический диапазон из MSFT_NetTCPSetting и передаёт начало и размер элементу свободных портов
            и его триггерам. Поэтому после netsh ничего не нужно править вручную.
            Ключ прототипа обязан содержать макрос обнаружения, поэтому элемент свободных портов назван по диапазону.
            После смены диапазона создаётся новый элемент: его история начинается заново, прогнозу снова нужно шесть
            часов, а старый элемент отключается через 7 дней.
            Строка, которая не проходит проверку, вызывает ошибку. Пустой результат удалил бы уже обнаруженные
            элементы, а при ошибке они остаются.
          item_prototypes:
            - uuid: 57b80e59e6d946d688a0d7693bc4715e
              name: 'Порты: свободно в динамическом диапазоне'
              key: 'winex.ports.eph.free[{#PORT_START},{#PORT_NUM}]'
              type: DEPENDENT
              value_type: UNSIGNED
              master_item:
                key: 'wmi.getall[root\standardcimv2,"SELECT State,OwningProcess FROM MSFT_NetTCPConnection"]'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      if (value.slice(-1) !== ']') throw 'truncated WMI payload, ' + value.length + ' bytes';
                      var a = JSON.parse(value), lo = {#PORT_START}, num = {#PORT_NUM}, hi = lo + num - 1;
                      var used = {};
                      for (var i = 0; i < a.length; i++) {
                        var lp = Number(String(a[i].InstanceID || '').split('++')[1]);
                        if (lp >= lo && lp <= hi) used[lp] = 1;
                      }
                      return num - Object.keys(used).length;
              description: |
                Свободные порты в диапазоне, который задан в Windows. При нуле исходящие соединения не устанавливаются.
                Порты IPv4 и IPv6 считаются одним множеством, поэтому значение — верхняя оценка. UDP и резервирования
                портов не учитываются; запас закладывается в {$WINEX.PORTS.FREE.PCT}.
                Таблица сокетов разбирается второй раз, потому что фильтру по диапазону нужны отдельные строки.
              tags:
                - tag: component
                  value: network
                - tag: scope
                  value: capacity
          trigger_prototypes:
            - uuid: 9e79a5dfca644a16908b949aead20f6e
              expression: 'min(/Windows resource exhaustion by Zabbix agent active/winex.sock.time_wait,10m)>{#PORT_NUM}*{$WINEX.SOCK.TIMEWAIT.PCT}/100 and last(/Windows resource exhaustion by Zabbix agent active/winex.ports.eph.free[{#PORT_START},{#PORT_NUM}])>=0'
              name: 'Шторм переподключений'
              event_name: 'Сокетов в TIME_WAIT на {HOST.NAME}: {ITEM.LASTVALUE1}, больше {$WINEX.SOCK.TIMEWAIT.PCT}% диапазона из {#PORT_NUM} портов'
              priority: WARNING
              description: |
                Сокеты TIME_WAIT освобождаются сами за несколько минут, но пока они есть, они занимают порты
                динамического диапазона. Порог задан долей обнаруженного диапазона, поэтому триггер входит в правило
                обнаружения.
                У сокета TIME_WAIT нет владельца (OwningProcess 0), поэтому процесс не указан.
                last() по элементу свободных портов нужен потому, что прототип триггера обязан ссылаться на прототип
                элемента.
              dependencies:
                - name: 'Проба диапазона портов: нет данных'
                  expression: 'nodata(/Windows resource exhaustion by Zabbix agent active/wmi.getall[root\standardcimv2,"SELECT DynamicPortRangeStartPort,DynamicPortRangeNumberOfPorts FROM MSFT_NetTCPSetting WHERE SettingName=''Internet''"],{$WINEX.NODATA.PERIOD})=1 and nodata(/Windows resource exhaustion by Zabbix agent active/wmi.getall[root\standardcimv2,"SELECT DynamicPortRangeStartPort,DynamicPortRangeNumberOfPorts FROM MSFT_NetTCPSetting WHERE SettingName=''Internet''"],30d)=0 and nodata(/Windows resource exhaustion by Zabbix agent active/perf_counter_en["\Memory\Pool Paged Bytes",60],5m)=0 and count(/Windows resource exhaustion by Zabbix agent active/perf_counter_en["\Memory\Pool Paged Bytes",60],{$WINEX.PROBE.INTERVAL}:now-{$WINEX.PROBE.INTERVAL})>0'
                - name: 'Проба сокетов: нет данных'
                  expression: 'nodata(/Windows resource exhaustion by Zabbix agent active/winex.sock.total,{$WINEX.NODATA.PERIOD})=1 and nodata(/Windows resource exhaustion by Zabbix agent active/winex.sock.total,30d)=0 and nodata(/Windows resource exhaustion by Zabbix agent active/perf_counter_en["\Memory\Pool Paged Bytes",60],5m)=0 and count(/Windows resource exhaustion by Zabbix agent active/perf_counter_en["\Memory\Pool Paged Bytes",60],{$WINEX.PROBE.INTERVAL}:now-{$WINEX.PROBE.INTERVAL})>0'
              tags:
                - tag: component
                  value: network
                - tag: scope
                  value: capacity
            - uuid: a6ae81f9181b48a294c5cb0c679f1681
              expression: 'max(/Windows resource exhaustion by Zabbix agent active/winex.ports.eph.free[{#PORT_START},{#PORT_NUM}],15m)<{#PORT_NUM}*{$WINEX.PORTS.FREE.PCT}/100 and length(last(/Windows resource exhaustion by Zabbix agent active/winex.sock.bound.top))>0'
              name: 'Динамический диапазон портов кончается'
              event_name: 'Свободных динамических портов на {HOST.NAME}: {ITEM.LASTVALUE1} из {#PORT_NUM}'
              opdata: 'держат Bound: {{ITEM.LASTVALUE2}.regsub("(.*)", \1)}'
              priority: HIGH
              description: 'Порог задан долей измеренного диапазона: после расширения диапазона фиксированное число значило бы другое. Расширение через netsh откладывает отказ. Процесс, который занимает порты, указан в operational data.'
              dependencies:
                - name: 'Проба диапазона портов: нет данных'
                  expression: 'nodata(/Windows resource exhaustion by Zabbix agent active/wmi.getall[root\standardcimv2,"SELECT DynamicPortRangeStartPort,DynamicPortRangeNumberOfPorts FROM MSFT_NetTCPSetting WHERE SettingName=''Internet''"],{$WINEX.NODATA.PERIOD})=1 and nodata(/Windows resource exhaustion by Zabbix agent active/wmi.getall[root\standardcimv2,"SELECT DynamicPortRangeStartPort,DynamicPortRangeNumberOfPorts FROM MSFT_NetTCPSetting WHERE SettingName=''Internet''"],30d)=0 and nodata(/Windows resource exhaustion by Zabbix agent active/perf_counter_en["\Memory\Pool Paged Bytes",60],5m)=0 and count(/Windows resource exhaustion by Zabbix agent active/perf_counter_en["\Memory\Pool Paged Bytes",60],{$WINEX.PROBE.INTERVAL}:now-{$WINEX.PROBE.INTERVAL})>0'
                - name: 'Проба сокетов: нет данных'
                  expression: 'nodata(/Windows resource exhaustion by Zabbix agent active/winex.sock.total,{$WINEX.NODATA.PERIOD})=1 and nodata(/Windows resource exhaustion by Zabbix agent active/winex.sock.total,30d)=0 and nodata(/Windows resource exhaustion by Zabbix agent active/perf_counter_en["\Memory\Pool Paged Bytes",60],5m)=0 and count(/Windows resource exhaustion by Zabbix agent active/perf_counter_en["\Memory\Pool Paged Bytes",60],{$WINEX.PROBE.INTERVAL}:now-{$WINEX.PROBE.INTERVAL})>0'
              url_name: 'Имена по PID'
              url: 'zabbix.php?action=latest.view&hostids%5B%5D={HOST.ID}&name=%D0%B8%D0%BC%D0%B5%D0%BD%D0%B0+%D0%BF%D0%BE+PID&filter_set=1'
              tags:
                - tag: component
                  value: network
                - tag: scope
                  value: capacity
            - uuid: 7565bd6f93354ef5808c73032cbfc289
              expression: 'min(/Windows resource exhaustion by Zabbix agent active/winex.sock.bound,1h)>{$WINEX.SOCK.BOUND.FLOOR} and timeleft(/Windows resource exhaustion by Zabbix agent active/winex.ports.eph.free[{#PORT_START},{#PORT_NUM}],6h,0)<{$WINEX.PORTS.TIMELEFT}'
              name: 'Динамический диапазон портов скоро кончится'
              event_name: 'Динамические порты на {HOST.NAME} кончатся меньше чем через {$WINEX.PORTS.TIMELEFT} при нынешнем расходе'
              opdata: 'Bound сейчас {ITEM.LASTVALUE1}, свободно {ITEM.LASTVALUE2}'
              priority: WARNING
              description: |
                Линейный прогноз по свободным портам за последние шесть часов.
                Срабатывает, только если хост уже час держит больше {$WINEX.SOCK.BOUND.FLOOR} сокетов Bound: на ровных
                данных timeleft() даёт шум.
              dependencies:
                - name: 'Проба диапазона портов: нет данных'
                  expression: 'nodata(/Windows resource exhaustion by Zabbix agent active/wmi.getall[root\standardcimv2,"SELECT DynamicPortRangeStartPort,DynamicPortRangeNumberOfPorts FROM MSFT_NetTCPSetting WHERE SettingName=''Internet''"],{$WINEX.NODATA.PERIOD})=1 and nodata(/Windows resource exhaustion by Zabbix agent active/wmi.getall[root\standardcimv2,"SELECT DynamicPortRangeStartPort,DynamicPortRangeNumberOfPorts FROM MSFT_NetTCPSetting WHERE SettingName=''Internet''"],30d)=0 and nodata(/Windows resource exhaustion by Zabbix agent active/perf_counter_en["\Memory\Pool Paged Bytes",60],5m)=0 and count(/Windows resource exhaustion by Zabbix agent active/perf_counter_en["\Memory\Pool Paged Bytes",60],{$WINEX.PROBE.INTERVAL}:now-{$WINEX.PROBE.INTERVAL})>0'
                - name: 'Динамический диапазон портов кончается'
                  expression: 'max(/Windows resource exhaustion by Zabbix agent active/winex.ports.eph.free[{#PORT_START},{#PORT_NUM}],15m)<{#PORT_NUM}*{$WINEX.PORTS.FREE.PCT}/100 and length(last(/Windows resource exhaustion by Zabbix agent active/winex.sock.bound.top))>0'
              tags:
                - tag: component
                  value: network
                - tag: scope
                  value: capacity
          graph_prototypes:
            - uuid: 184c80fe459544c98b6a5e8a2cf2a8a5
              name: 'Исчерпание Windows: свободные порты {#PORT_START}+{#PORT_NUM}'
              graph_items:
                - sortorder: '0'
                  color: 1A7C11
                  item:
                    host: Windows resource exhaustion by Zabbix agent active
                    key: 'winex.ports.eph.free[{#PORT_START},{#PORT_NUM}]'
                - sortorder: '1'
                  color: F63100
                  item:
                    host: Windows resource exhaustion by Zabbix agent active
                    key: winex.sock.bound.max
      tags:
        - tag: class
          value: os
        - tag: target
          value: windows
        - tag: vendor
          value: microsoft
      macros:
        - macro: '{$WINEX.HANDLES.CEILING}'
          value: '100000'
          description: 'Сколько дескрипторов самый занятый процесс может держать весь день, по суточному минимуму. Самый большой минимум на здоровом хосте парка — 58000 у индексатора поиска. Переопределяется на хосте с законно крупным держателем.'
        - macro: '{$WINEX.NODATA.PERIOD}'
          value: 15m
          description: 'Сколько проба может молчать, прежде чем сработает её триггер «нет данных». Не меньше трёх {$WINEX.PROBE.INTERVAL}.'
        - macro: '{$WINEX.POOL.NONPAGED.PCT}'
          value: '20'
          description: 'Порог невыгружаемого пула, процент физической памяти. Здоровые хосты парка — от 0,2 до 6,4%.'
        - macro: '{$WINEX.POOL.PAGED.PCT}'
          value: '15'
          description: 'Порог выгружаемого пула, процент физической памяти. Медиана парка — 3,5%, худший случай на парке — 30%.'
        - macro: '{$WINEX.PORTS.FREE.PCT}'
          value: '12'
          description: 'Минимум свободных портов, процент обнаруженного динамического диапазона.'
        - macro: '{$WINEX.PORTS.TIMELEFT}'
          value: 1d
          description: 'На сколько вперёд смотрит прогноз по портам.'
        - macro: '{$WINEX.PROBE.INTERVAL}'
          value: 5m
          description: 'Интервал опроса четырёх WMI-проб. Он же — глубина проверки живости агента в триггерах «нет данных».'
        - macro: '{$WINEX.SOCK.BOUND.FLOOR}'
          value: '500'
          description: 'Сколько сокетов Bound хост должен держать час, прежде чем прогноз по портам может сработать.'
        - macro: '{$WINEX.SOCK.CLOSEWAIT.MAX}'
          value: '200'
          description: 'Сокетов CLOSE_WAIT на хосте в течение 15 минут.'
        - macro: '{$WINEX.SOCK.TIMEWAIT.PCT}'
          value: '25'
          description: 'Сокетов TIME_WAIT, процент обнаруженного динамического диапазона.'
        - macro: '{$WINEX.WMI.TIMEOUT}'
          value: 30s
          description: 'Таймаут WMI-проб. 30s — максимум Zabbix.'
  triggers:
    - uuid: ce84ff442dff481eadf155ef88310bcb
      expression: 'nodata(/Windows resource exhaustion by Zabbix agent active/winex.sock.total,{$WINEX.NODATA.PERIOD})=1 and nodata(/Windows resource exhaustion by Zabbix agent active/winex.sock.total,30d)=0 and nodata(/Windows resource exhaustion by Zabbix agent active/perf_counter_en["\Memory\Pool Paged Bytes",60],5m)=0 and count(/Windows resource exhaustion by Zabbix agent active/perf_counter_en["\Memory\Pool Paged Bytes",60],{$WINEX.PROBE.INTERVAL}:now-{$WINEX.PROBE.INTERVAL})>0'
      name: 'Проба сокетов: нет данных'
      event_name: 'Проба сокетов на {HOST.NAME} не присылает данных {$WINEX.NODATA.PERIOD}'
      opdata: 'последнее значение, сокетов: {ITEM.LASTVALUE1}'
      priority: WARNING
      description: |
        Проба MSFT_NetTCPConnection перестала присылать данные, а агент жив: WMI не уложился в таймаут или
        ответ отброшен как обрезанный. У каждой пробы свой триггер «нет данных», поэтому зависший запрос
        сокетов не прячет алерты по дескрипторам и пулу, данные для которых продолжают приходить.
        Срабатывает, только если счётчик пула ядра приходил за последние 5 минут и ещё один интервал пробы
        назад. Если недоступны агент, прокси или канал, счётчик тоже не приходит, и триггер молчит: этот случай
        сообщает стандартный шаблон. Вторая проверка нужна после восстановления: счётчик возвращается примерно
        через минуту после старта агента, а проба — до одного интервала позже.
        nodata(...,30d)=0 означает, что проба хотя бы раз отвечала. В отличие от last(), это условие вычисляется
        и на неподдерживаемом элементе, а на только что привязанном хосте не даёт триггеру сработать.
        Прогон по истории за 31 день на 38 хостах: два срабатывания, оба — настоящий сбой WMI.
      tags:
        - tag: component
          value: network
        - tag: scope
          value: availability
    - uuid: d6ee90082baa4011baa0f57624b46713
      expression: 'nodata(/Windows resource exhaustion by Zabbix agent active/winex.handles.total,{$WINEX.NODATA.PERIOD})=1 and nodata(/Windows resource exhaustion by Zabbix agent active/winex.handles.total,30d)=0 and nodata(/Windows resource exhaustion by Zabbix agent active/perf_counter_en["\Memory\Pool Paged Bytes",60],5m)=0 and count(/Windows resource exhaustion by Zabbix agent active/perf_counter_en["\Memory\Pool Paged Bytes",60],{$WINEX.PROBE.INTERVAL}:now-{$WINEX.PROBE.INTERVAL})>0'
      name: 'Проба процессов: нет данных'
      event_name: 'Проба процессов на {HOST.NAME} не присылает данных {$WINEX.NODATA.PERIOD}'
      opdata: 'последнее значение, дескрипторов: {ITEM.LASTVALUE1}'
      priority: WARNING
      description: |
        Проба Win32_Process перестала присылать данные, а агент жив. Условия те же, что у «Проба сокетов:
        нет данных». Запрос процессов отказывает независимо от запроса сокетов, поэтому зависимости между ними
        нет.
      tags:
        - tag: component
          value: os
        - tag: scope
          value: availability
    - uuid: ae13b0bc20df4b459613f94a41566ca2
      expression: '(nodata(/Windows resource exhaustion by Zabbix agent active/perf_counter_en["\Memory\Pool Nonpaged Bytes",60],{$WINEX.NODATA.PERIOD})=1 or nodata(/Windows resource exhaustion by Zabbix agent active/perf_counter_en["\Memory\Pool Paged Bytes",60],{$WINEX.NODATA.PERIOD})=1) and nodata(/Windows resource exhaustion by Zabbix agent active/perf_counter_en["\Memory\Pool Nonpaged Bytes",60],30d)=0 and nodata(/Windows resource exhaustion by Zabbix agent active/perf_counter_en["\Memory\Pool Paged Bytes",60],30d)=0 and nodata(/Windows resource exhaustion by Zabbix agent active/wmi.get[root\cimv2,"SELECT TotalPhysicalMemory FROM Win32_ComputerSystem"],{$WINEX.NODATA.PERIOD})=0 and count(/Windows resource exhaustion by Zabbix agent active/wmi.get[root\cimv2,"SELECT TotalPhysicalMemory FROM Win32_ComputerSystem"],{$WINEX.NODATA.PERIOD}:now-{$WINEX.NODATA.PERIOD})>0'
      name: 'Пул ядра: нет данных'
      event_name: 'Счётчики пула ядра на {HOST.NAME} не присылают данных {$WINEX.NODATA.PERIOD}'
      opdata: 'последние значения: невыгружаемый {ITEM.LASTVALUE1}, выгружаемый {ITEM.LASTVALUE2}'
      priority: WARNING
      description: |
        Счётчики пула ядра перестали приходить, а агент жив, например после повреждения реестра счётчиков
        производительности. Выгружаемый счётчик служит проверкой живости агента для остальных триггеров
        «нет данных», поэтому этот триггер проверяет агента по WMI-запросу объёма памяти: значение должно
        прийти за последний {$WINEX.NODATA.PERIOD} и за такой же период до него.
      tags:
        - tag: component
          value: memory
        - tag: scope
          value: availability
    - uuid: 83257a589f9843d088f75fa5150bfabf
      expression: '(nodata(/Windows resource exhaustion by Zabbix agent active/winex.pool.nonpaged.pct,{$WINEX.NODATA.PERIOD})=1 or nodata(/Windows resource exhaustion by Zabbix agent active/winex.pool.paged.pct,{$WINEX.NODATA.PERIOD})=1 or nodata(/Windows resource exhaustion by Zabbix agent active/wmi.get[root\cimv2,"SELECT TotalPhysicalMemory FROM Win32_ComputerSystem"],{$WINEX.NODATA.PERIOD})=1) and nodata(/Windows resource exhaustion by Zabbix agent active/winex.pool.nonpaged.pct,30d)=0 and nodata(/Windows resource exhaustion by Zabbix agent active/winex.pool.paged.pct,30d)=0 and nodata(/Windows resource exhaustion by Zabbix agent active/wmi.get[root\cimv2,"SELECT TotalPhysicalMemory FROM Win32_ComputerSystem"],30d)=0 and nodata(/Windows resource exhaustion by Zabbix agent active/perf_counter_en["\Memory\Pool Paged Bytes",60],5m)=0 and count(/Windows resource exhaustion by Zabbix agent active/perf_counter_en["\Memory\Pool Paged Bytes",60],{$WINEX.PROBE.INTERVAL}:now-{$WINEX.PROBE.INTERVAL})>0'
      name: 'Доли пула ядра: нет данных'
      event_name: 'Доли пула ядра на {HOST.NAME} не вычисляются'
      opdata: 'последние значения: невыгружаемый {ITEM.LASTVALUE1} RAM, выгружаемый {ITEM.LASTVALUE2} RAM'
      priority: WARNING
      description: |
        Порогам пула нужны счётчик и объём памяти. Триггер срабатывает, когда доли или запрос памяти перестали
        приходить, а агент жив, например когда WMI-запрос памяти не уложился в таймаут.
        Зависит от «Пул ядра: нет данных»: если остановились сами счётчики, причину называет тот триггер.
      dependencies:
        - name: 'Пул ядра: нет данных'
          expression: '(nodata(/Windows resource exhaustion by Zabbix agent active/perf_counter_en["\Memory\Pool Nonpaged Bytes",60],{$WINEX.NODATA.PERIOD})=1 or nodata(/Windows resource exhaustion by Zabbix agent active/perf_counter_en["\Memory\Pool Paged Bytes",60],{$WINEX.NODATA.PERIOD})=1) and nodata(/Windows resource exhaustion by Zabbix agent active/perf_counter_en["\Memory\Pool Nonpaged Bytes",60],30d)=0 and nodata(/Windows resource exhaustion by Zabbix agent active/perf_counter_en["\Memory\Pool Paged Bytes",60],30d)=0 and nodata(/Windows resource exhaustion by Zabbix agent active/wmi.get[root\cimv2,"SELECT TotalPhysicalMemory FROM Win32_ComputerSystem"],{$WINEX.NODATA.PERIOD})=0 and count(/Windows resource exhaustion by Zabbix agent active/wmi.get[root\cimv2,"SELECT TotalPhysicalMemory FROM Win32_ComputerSystem"],{$WINEX.NODATA.PERIOD}:now-{$WINEX.NODATA.PERIOD})>0'
      tags:
        - tag: component
          value: memory
        - tag: scope
          value: availability
    - uuid: 67e59281c9d84fca9138afdc78ad4f9b
      expression: 'nodata(/Windows resource exhaustion by Zabbix agent active/wmi.getall[root\standardcimv2,"SELECT DynamicPortRangeStartPort,DynamicPortRangeNumberOfPorts FROM MSFT_NetTCPSetting WHERE SettingName=''Internet''"],{$WINEX.NODATA.PERIOD})=1 and nodata(/Windows resource exhaustion by Zabbix agent active/wmi.getall[root\standardcimv2,"SELECT DynamicPortRangeStartPort,DynamicPortRangeNumberOfPorts FROM MSFT_NetTCPSetting WHERE SettingName=''Internet''"],30d)=0 and nodata(/Windows resource exhaustion by Zabbix agent active/perf_counter_en["\Memory\Pool Paged Bytes",60],5m)=0 and count(/Windows resource exhaustion by Zabbix agent active/perf_counter_en["\Memory\Pool Paged Bytes",60],{$WINEX.PROBE.INTERVAL}:now-{$WINEX.PROBE.INTERVAL})>0'
      name: 'Проба диапазона портов: нет данных'
      event_name: 'Динамический диапазон портов на {HOST.NAME} не измерялся {$WINEX.NODATA.PERIOD}'
      opdata: 'последний диапазон: {{ITEM.LASTVALUE1}.regsub("StartPort[^0-9]+([0-9]+)", \1)} + {{ITEM.LASTVALUE1}.regsub("NumberOfPorts[^0-9]+([0-9]+)", \1)} портов'
      priority: WARNING
      description: |
        Проба MSFT_NetTCPSetting перестала присылать данные, а агент жив. Без неё обнаруженный диапазон
        остаётся прежним, и диапазон, изменённый через netsh, не подхватывается. Условия те же, что у «Проба
        сокетов: нет данных».
      tags:
        - tag: component
          value: network
        - tag: scope
          value: availability
    - uuid: fc3c401634b0424c8d137538b54a4fa4
      expression: 'count(/Windows resource exhaustion by Zabbix agent active/eventlog[System,,,,^4231$,,skip],30m)>0'
      recovery_mode: RECOVERY_EXPRESSION
      recovery_expression: 'nodata(/Windows resource exhaustion by Zabbix agent active/eventlog[System,,,,^4231$,,skip],1h)=1'
      name: 'Windows сообщает, что динамический диапазон портов исчерпан'
      event_name: 'Windows на {HOST.NAME} не смогла выделить эфемерный порт (событие 4231)'
      priority: HIGH
      description: |
        Событие 4231 (Tcpip): «A request to allocate an ephemeral port number from the global TCP port space has
        failed due to all such ports being in use». Новые исходящие соединения сейчас не устанавливаются.
        Триггеры свободных портов и прогноза срабатывают раньше. Этот подтверждает отказ и процесс не называет.
        До версии 1.5.0 он по ошибке читал событие 4227 и сработал 28 раз на хостах, где было занято
        не больше 508 портов из 16384.
        Закрывается через час без новых событий: с одним count() проблема не закрылась бы никогда, потому что
        элемент журнала получает значения только во время сбоя.
      tags:
        - tag: component
          value: network
        - tag: scope
          value: capacity
    - uuid: 1c0ea932ec8442f6aac7638ee1d34c2f
      expression: 'count(/Windows resource exhaustion by Zabbix agent active/eventlog[System,,,,^4227$,,skip],30m)>0'
      recovery_mode: RECOVERY_EXPRESSION
      recovery_expression: 'nodata(/Windows resource exhaustion by Zabbix agent active/eventlog[System,,,,^4227$,,skip],1h)=1'
      name: 'Локальная точка переиспользуется быстрее, чем истекает TIME_WAIT'
      event_name: 'Windows на {HOST.NAME} отклонила исходящее соединение: локальная точка недавно использовалась (событие 4227)'
      priority: WARNING
      description: |
        Событие 4227 (Tcpip): «TCP/IP failed to establish an outgoing connection because the selected local
        endpoint was recently used to connect to the same remote endpoint». Одно приложение открывает и
        закрывает соединения к одному адресу быстрее, чем истекает TIME_WAIT. Диапазон обычно далеко
        не заполнен, и расширение через netsh не поможет: приложению нужно переиспользовать соединения.
        Закрывается через час без новых событий, как триггер 4231.
      tags:
        - tag: component
          value: network
        - tag: scope
          value: capacity
    - uuid: 361ed86a3ddd49ae907871108c4fcc62
      expression: 'min(/Windows resource exhaustion by Zabbix agent active/winex.sock.close_wait,15m)>{$WINEX.SOCK.CLOSEWAIT.MAX} and length(last(/Windows resource exhaustion by Zabbix agent active/winex.sock.close_wait.top))>0'
      name: 'Соединения не закрываются'
      event_name: 'Сокетов в CLOSE_WAIT на {HOST.NAME}: {ITEM.LASTVALUE1}'
      opdata: 'больше всего: {{ITEM.LASTVALUE2}.regsub("(.*)", \1)}'
      priority: WARNING
      description: |
        Сокеты копятся в CLOSE_WAIT, когда удалённая сторона закрыла соединение, а локальное приложение
        не вызвало close(). PID приложения указан в operational data.
        Пока проба сокетов молчит, триггер сохраняет состояние, а о пропуске сообщает «Проба сокетов: нет
        данных».
      dependencies:
        - name: 'Проба сокетов: нет данных'
          expression: 'nodata(/Windows resource exhaustion by Zabbix agent active/winex.sock.total,{$WINEX.NODATA.PERIOD})=1 and nodata(/Windows resource exhaustion by Zabbix agent active/winex.sock.total,30d)=0 and nodata(/Windows resource exhaustion by Zabbix agent active/perf_counter_en["\Memory\Pool Paged Bytes",60],5m)=0 and count(/Windows resource exhaustion by Zabbix agent active/perf_counter_en["\Memory\Pool Paged Bytes",60],{$WINEX.PROBE.INTERVAL}:now-{$WINEX.PROBE.INTERVAL})>0'
      url_name: 'Имена по PID'
      url: 'zabbix.php?action=latest.view&hostids%5B%5D={HOST.ID}&name=%D0%B8%D0%BC%D0%B5%D0%BD%D0%B0+%D0%BF%D0%BE+PID&filter_set=1'
      tags:
        - tag: component
          value: network
        - tag: scope
          value: capacity
    - uuid: 4a9d61c0f7b84e2ea3d5b8091c6e7f34
      expression: 'min(/Windows resource exhaustion by Zabbix agent active/winex.handles.max,24h)>{$WINEX.HANDLES.CEILING} and length(last(/Windows resource exhaustion by Zabbix agent active/winex.handles.top))>0'
      name: 'Дескрипторов у одного процесса больше порога'
      event_name: 'Дескрипторов у {{ITEM.LASTVALUE2}.regsub("^(.*?) \(PID", \1)} на {HOST.NAME}: {ITEM.LASTVALUE1}'
      opdata: 'сейчас {ITEM.LASTVALUE1}, больше всего: {{ITEM.LASTVALUE2}.regsub("(.*)", \1)}'
      priority: AVERAGE
      url_name: 'Дескрипторы на этом хосте'
      url: 'zabbix.php?action=latest.view&hostids%5B%5D={HOST.ID}&name=%D0%94%D0%B5%D1%81%D0%BA%D1%80%D0%B8%D0%BF%D1%82%D0%BE%D1%80%D1%8B&filter_set=1'
      description: |
        Самый занятый процесс весь день держал больше {$WINEX.HANDLES.CEILING} дескрипторов: триггер читает
        суточный минимум, поэтому дневные пики не учитываются.
        Порог — не предел Windows: на процесс Windows разрешает 16777216 дескрипторов. Самый крупный держатель
        на разных хостах разный (svchost, lsass, индексатор поиска). Если на хосте законно работает крупный,
        {$WINEX.HANDLES.CEILING} переопределяется на этом хосте.
        Важность Average: устойчивое число требует плановой перезагрузки. Перед перезагрузкой стоит посмотреть
        элементы пула ядра, память ядра кончается раньше.
        В имени события число на момент открытия проблемы, текущее число — в operational data.
      dependencies:
        - name: 'Проба процессов: нет данных'
          expression: 'nodata(/Windows resource exhaustion by Zabbix agent active/winex.handles.total,{$WINEX.NODATA.PERIOD})=1 and nodata(/Windows resource exhaustion by Zabbix agent active/winex.handles.total,30d)=0 and nodata(/Windows resource exhaustion by Zabbix agent active/perf_counter_en["\Memory\Pool Paged Bytes",60],5m)=0 and count(/Windows resource exhaustion by Zabbix agent active/perf_counter_en["\Memory\Pool Paged Bytes",60],{$WINEX.PROBE.INTERVAL}:now-{$WINEX.PROBE.INTERVAL})>0'
      tags:
        - tag: process
          value: '{{ITEM.VALUE2}.regsub("^(.*?) \(PID", \1)}'
        - tag: component
          value: os
        - tag: scope
          value: capacity
    - uuid: 8b30fefdb48241e5a3f71075bcfa8c7b
      expression: 'min(/Windows resource exhaustion by Zabbix agent active/winex.pool.nonpaged.pct,10m)>{$WINEX.POOL.NONPAGED.PCT} and last(/Windows resource exhaustion by Zabbix agent active/perf_counter_en["\Memory\Pool Nonpaged Bytes",60])>=0'
      name: 'Невыгружаемый пул выше порога'
      event_name: 'Невыгружаемый пул на {HOST.NAME}: {ITEM.LASTVALUE1} RAM'
      opdata: 'невыгружаемый пул сейчас: {ITEM.LASTVALUE2}'
      priority: HIGH
      description: |
        Порог задан долей физической памяти: на x64 размер невыгружаемого пула ограничен ею.
        Когда невыгружаемый пул кончается, останавливается вся машина.
        last() по счётчику в байтах включает его в выражение ради operational data.
      dependencies:
        - name: 'Доли пула ядра: нет данных'
          expression: '(nodata(/Windows resource exhaustion by Zabbix agent active/winex.pool.nonpaged.pct,{$WINEX.NODATA.PERIOD})=1 or nodata(/Windows resource exhaustion by Zabbix agent active/winex.pool.paged.pct,{$WINEX.NODATA.PERIOD})=1 or nodata(/Windows resource exhaustion by Zabbix agent active/wmi.get[root\cimv2,"SELECT TotalPhysicalMemory FROM Win32_ComputerSystem"],{$WINEX.NODATA.PERIOD})=1) and nodata(/Windows resource exhaustion by Zabbix agent active/winex.pool.nonpaged.pct,30d)=0 and nodata(/Windows resource exhaustion by Zabbix agent active/winex.pool.paged.pct,30d)=0 and nodata(/Windows resource exhaustion by Zabbix agent active/wmi.get[root\cimv2,"SELECT TotalPhysicalMemory FROM Win32_ComputerSystem"],30d)=0 and nodata(/Windows resource exhaustion by Zabbix agent active/perf_counter_en["\Memory\Pool Paged Bytes",60],5m)=0 and count(/Windows resource exhaustion by Zabbix agent active/perf_counter_en["\Memory\Pool Paged Bytes",60],{$WINEX.PROBE.INTERVAL}:now-{$WINEX.PROBE.INTERVAL})>0'
      tags:
        - tag: component
          value: memory
        - tag: scope
          value: capacity
    - uuid: 6b5869e9585f49a18ac50c4531299b4b
      expression: 'min(/Windows resource exhaustion by Zabbix agent active/winex.pool.paged.pct,10m)>{$WINEX.POOL.PAGED.PCT} and last(/Windows resource exhaustion by Zabbix agent active/perf_counter_en["\Memory\Pool Paged Bytes",60])>=0'
      name: 'Выгружаемый пул выше порога'
      event_name: 'Выгружаемый пул на {HOST.NAME}: {ITEM.LASTVALUE1} RAM'
      opdata: 'выгружаемый пул сейчас: {ITEM.LASTVALUE2}'
      priority: HIGH
      description: |
        Когда выгружаемый пул кончается, перестают создаваться дескрипторы, ключи реестра и куча рабочего
        стола. Порог задан долей памяти и выше, чем у невыгружаемого: выгружаемый пул сильнее отличается
        у серверов разных ролей. last() по счётчику в байтах включает его в выражение ради operational data.
      dependencies:
        - name: 'Доли пула ядра: нет данных'
          expression: '(nodata(/Windows resource exhaustion by Zabbix agent active/winex.pool.nonpaged.pct,{$WINEX.NODATA.PERIOD})=1 or nodata(/Windows resource exhaustion by Zabbix agent active/winex.pool.paged.pct,{$WINEX.NODATA.PERIOD})=1 or nodata(/Windows resource exhaustion by Zabbix agent active/wmi.get[root\cimv2,"SELECT TotalPhysicalMemory FROM Win32_ComputerSystem"],{$WINEX.NODATA.PERIOD})=1) and nodata(/Windows resource exhaustion by Zabbix agent active/winex.pool.nonpaged.pct,30d)=0 and nodata(/Windows resource exhaustion by Zabbix agent active/winex.pool.paged.pct,30d)=0 and nodata(/Windows resource exhaustion by Zabbix agent active/wmi.get[root\cimv2,"SELECT TotalPhysicalMemory FROM Win32_ComputerSystem"],30d)=0 and nodata(/Windows resource exhaustion by Zabbix agent active/perf_counter_en["\Memory\Pool Paged Bytes",60],5m)=0 and count(/Windows resource exhaustion by Zabbix agent active/perf_counter_en["\Memory\Pool Paged Bytes",60],{$WINEX.PROBE.INTERVAL}:now-{$WINEX.PROBE.INTERVAL})>0'
      tags:
        - tag: component
          value: memory
        - tag: scope
          value: capacity

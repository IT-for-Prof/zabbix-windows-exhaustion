zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 1d9c5416b33343fa94a09c66b4ed9e22
      name: Templates/Operating systems
  templates:
    - uuid: 66dc4a2b623142faad3d97af8561ff1c
      template: Windows resource exhaustion by Zabbix agent active
      name: Windows resource exhaustion by Zabbix agent active
      description: |
        Resource exhaustion on Windows - sockets, handles, kernel pool - attributed per process.

        Answers "which process on this machine is using up what". Stock agent keys only (wmi.getall, wmi.get,
        perf_counter_en, eventlog): no agent configuration change, no UserParameter.

        Collected:
        - TCP sockets by state from MSFT_NetTCPConnection, including Bound, which netstat without -q and
          net.tcp.socket.count do not report;
        - the five processes holding the most Bound and CLOSE_WAIT sockets, for alert operational data;
        - the dynamic port range as Windows has it, and the free ports left in it;
        - handles: system total, busiest process, top five as "name (PID n)=count";
        - kernel pool, nonpaged and paged, in bytes and as a share of RAM;
        - Windows events 4231 (no ephemeral port left) and 4227 (local endpoint reused too fast).

        Four WMI queries run every {$WINEX.PROBE.INTERVAL}: sockets, processes, port range, physical memory.
        The raw socket and process tables are not stored.

        Every trigger is tied to a limit: kernel pool as a share of RAM, free ports in the discovered range, the
        24-hour minimum of the busiest process's handles, a timeleft forecast on ports, and the event log. Growth
        alone raises nothing. The handle ceiling is the one number not derived from the host; where a host
        legitimately runs a large holder, override {$WINEX.HANDLES.CEILING} on that host.

        A no-data trigger fires when a probe stops while the agent keeps sending its 1-minute kernel pool
        counter. When the agent, proxy or link is down, the counter stops too and nothing fires here; the stock
        template reports that case.

        Socket alerts carry PIDs, and process names are in "Processes: PID to name map": Zabbix cannot join two
        master items.

        Requirements:
        - Windows 8 / Server 2012 or newer (root\StandardCimv2 with MSFT_NetTCPConnection).
        - Zabbix agent or agent 2, 7.0 or newer. Older agents ignore the per-item timeout of an active check.
        - Every item is an active check: ServerActive points at the server or proxy, Hostname matches the host.
        - Link together with the stock "Windows by Zabbix agent active". It reports a dead agent or a wrong
          ServerActive; the no-data triggers here fire only while the agent is alive.
        - Keep at least 24 hours of history on winex.handles.max: the handle ceiling reads its 24-hour minimum.
        - {$WINEX.WMI.TIMEOUT} is 30s, the Zabbix maximum. MSFT_NetTCPConnection costs about 4-5 ms per
          connection, so the socket probe fails above roughly 6000-7000 connections. On such a host, the last
          successful winex.sock.bound.top names the process holding them.
        - {$WINEX.NODATA.PERIOD} must be at least three times {$WINEX.PROBE.INTERVAL}.

        Author:  Konstantin Tyutyunnik / Константин Тютюнник
        Site:    https://itforprof.com
        Repo:    https://github.com/IT-for-Prof/zabbix-windows-exhaustion
        License: MIT (c) 2026 Konstantin Tyutyunnik
      vendor:
        name: itforprof.com
        version: 1.6.0
      groups:
        - name: Templates/Operating systems
      items:
        - uuid: 865e40f31d4a4dbea7082f5a57214b24
          name: 'Sockets: WMI probe'
          key: 'wmi.getall[root\standardcimv2,"SELECT State,OwningProcess FROM MSFT_NetTCPConnection"]'
          type: ZABBIX_ACTIVE
          delay: '{$WINEX.PROBE.INTERVAL}'
          timeout: '{$WINEX.WMI.TIMEOUT}'
          history: '0'
          trends: '0'
          value_type: TEXT
          description: |
            Raw socket table, about 60 bytes per socket.
            History is 0: the history column truncates at 65535 bytes while preprocessing receives the full value.
            The local port is parsed from InstanceID, which WMI returns whether or not it is selected.
          tags:
            - tag: component
              value: network
            - tag: scope
              value: capacity
        - uuid: bf79fa9a74ff4e5b9ad0139a7af6c530
          name: 'Processes: WMI probe'
          key: 'wmi.getall[root\cimv2,"SELECT Name,ProcessId,HandleCount FROM Win32_Process"]'
          type: ZABBIX_ACTIVE
          delay: '{$WINEX.PROBE.INTERVAL}'
          timeout: '{$WINEX.WMI.TIMEOUT}'
          history: '0'
          trends: '0'
          value_type: TEXT
          description: 'Raw process table. Feeds the handle items and the PID to name map.'
          tags:
            - tag: component
              value: os
            - tag: scope
              value: capacity
        - uuid: 7e14c50bb6034fc6b6d2d85c63c5de5d
          name: 'Sockets: state summary'
          key: winex.sock.summary
          type: DEPENDENT
          history: '0'
          trends: '0'
          value_type: TEXT
          master_item:
            key: 'wmi.getall[root\standardcimv2,"SELECT State,OwningProcess FROM MSFT_NetTCPConnection"]'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  if (value.slice(-1) !== ']') throw 'truncated WMI payload, ' + value.length + ' bytes';
                  var a = JSON.parse(value);
                  var acc = {bound: {}, cw: {}};
                  var c = {total: a.length, listen: 0, established: 0, close_wait: 0, time_wait: 0, bound: 0};
                  for (var i = 0; i < a.length; i++) {
                    var st = Number(a[i].State), bucket = null;
                    if (st === 2) c.listen++;
                    else if (st === 5) c.established++;
                    else if (st === 8) { c.close_wait++; bucket = 'cw'; }
                    else if (st === 11) c.time_wait++;
                    else if (st === 100) { c.bound++; bucket = 'bound'; }
                    if (bucket) {
                      var p = String(a[i].OwningProcess);
                      acc[bucket][p] = (acc[bucket][p] || 0) + 1;
                    }
                  }
                  function top(o) {
                    var r = [];
                    for (var k in o) r.push([k, o[k]]);
                    r.sort(function (x, y) { return y[1] - x[1]; });
                    var out = [];
                    for (var i = 0; i < r.length && i < 5; i++) out.push('PID ' + r[i][0] + '=' + r[i][1]);
                    return out.length ? out.join(', ') : 'none';
                  }
                  c.bound_max = 0;
                  for (var k in acc.bound) if (acc.bound[k] > c.bound_max) c.bound_max = acc.bound[k];
                  c.bound_top = top(acc.bound);
                  c.cw_top = top(acc.cw);
                  return JSON.stringify(c);
          description: |
            One pass over the raw table feeds every socket item: counts and per-process top lists.
            States: 2 Listen, 5 Established, 8 CloseWait, 11 TimeWait, 100 Bound. State 100 is missing from the class
            reference; it is a local port held with no peer.
          tags:
            - tag: component
              value: network
        - uuid: 153406683fb74e94a3be7694790c3061
          name: 'Sockets: total'
          key: winex.sock.total
          type: DEPENDENT
          value_type: UNSIGNED
          master_item:
            key: winex.sock.summary
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.total
          description: 'Watched by "Socket probe: no data". No value here means the socket probe timed out or its payload was rejected as truncated.'
          tags:
            - tag: component
              value: network
        - uuid: 2d4d185727424e3eb0925af32c314e3b
          name: 'Sockets: established'
          key: winex.sock.established
          type: DEPENDENT
          value_type: UNSIGNED
          master_item:
            key: winex.sock.summary
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.established
          description: 'IPv4 and IPv6 together. The \TCPv4\Connections Established counter alone undercounts a dual-stack host.'
          tags:
            - tag: component
              value: network
        - uuid: 6f0ebaf917294093a9bacc741904c08a
          name: 'Sockets: CLOSE_WAIT'
          key: winex.sock.close_wait
          type: DEPENDENT
          value_type: UNSIGNED
          master_item:
            key: winex.sock.summary
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.close_wait
          tags:
            - tag: component
              value: network
        - uuid: 3cae3d123bdd4d5b9560b9c4824155d7
          name: 'Sockets: TIME_WAIT'
          key: winex.sock.time_wait
          type: DEPENDENT
          value_type: UNSIGNED
          master_item:
            key: winex.sock.summary
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.time_wait
          tags:
            - tag: component
              value: network
        - uuid: 13630f1d76b34254b338234502ccdadc
          name: 'Sockets: Bound'
          key: winex.sock.bound
          type: DEPENDENT
          value_type: UNSIGNED
          master_item:
            key: winex.sock.summary
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.bound
          description: 'Sockets holding a local port with no peer. netstat without -q and net.tcp.socket.count do not show them. This number grows when ephemeral ports run out.'
          tags:
            - tag: component
              value: network
            - tag: scope
              value: capacity
        - uuid: 07650ec21c13495887f06491e78976be
          name: 'Sockets: Bound on the busiest process'
          key: winex.sock.bound.max
          type: DEPENDENT
          value_type: UNSIGNED
          master_item:
            key: winex.sock.summary
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.bound_max
          description: 'The maximum over processes. Workers such as httpd and svchost run in groups, and an average would hide one leaking instance.'
          tags:
            - tag: component
              value: network
            - tag: scope
              value: capacity
        - uuid: 8b02ab54b91a4e66a3b3756ab016fe16
          name: 'Sockets: top processes holding Bound'
          key: winex.sock.bound.top
          type: DEPENDENT
          value_type: TEXT
          master_item:
            key: winex.sock.summary
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.bound_top
          description: 'Top five as "PID n=count", short enough for the 255-character operational data. Process names are in "Processes: PID to name map".'
          tags:
            - tag: component
              value: network
            - tag: scope
              value: capacity
        - uuid: 63e220ea507348b28c45a7ac6994261f
          name: 'Sockets: top processes holding CLOSE_WAIT'
          key: winex.sock.close_wait.top
          type: DEPENDENT
          value_type: TEXT
          master_item:
            key: winex.sock.summary
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.cw_top
          description: 'A socket stays in CLOSE_WAIT when the local application never calls close() after the peer closed. This item names that application''s PID.'
          tags:
            - tag: component
              value: network
        - uuid: 000174cbe5f0478e846442b30bb9460f
          name: 'Ports: dynamic range probe'
          key: 'wmi.getall[root\standardcimv2,"SELECT DynamicPortRangeStartPort,DynamicPortRangeNumberOfPorts FROM MSFT_NetTCPSetting WHERE SettingName=''Internet''"]'
          type: ZABBIX_ACTIVE
          delay: '{$WINEX.PROBE.INTERVAL}'
          timeout: '{$WINEX.WMI.TIMEOUT}'
          history: 1d
          trends: '0'
          value_type: TEXT
          description: |
            The dynamic port range as Windows has it. netsh int ipv4 set dynamicport tcp start=N num=M stores it in
            an undocumented binary value under HKLM\SYSTEM\CurrentControlSet\Control\Nsi, so it is read over WMI.
            MaxUserPort in Tcpip\Parameters has been ignored since Vista.
          tags:
            - tag: component
              value: network
            - tag: scope
              value: capacity
        - uuid: 79dd9eebb9ed4b8d9bfd5e0749b21356
          name: 'Processes: handle summary'
          key: winex.proc.handles
          type: DEPENDENT
          history: '0'
          trends: '0'
          value_type: TEXT
          master_item:
            key: 'wmi.getall[root\cimv2,"SELECT Name,ProcessId,HandleCount FROM Win32_Process"]'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  if (value.slice(-1) !== ']') throw 'truncated WMI payload, ' + value.length + ' bytes';
                  var a = JSON.parse(value), t = 0, r = [];
                  for (var i = 0; i < a.length; i++) {
                    var h = Number(a[i].HandleCount || 0);
                    t += h;
                    r.push([String(a[i].Name), Number(a[i].ProcessId), h]);
                  }
                  var byPid = r.slice();
                  byPid.sort(function (x, y) { return x[1] - y[1]; });
                  var map = [];
                  for (var i = 0; i < byPid.length; i++) map.push(byPid[i][1] + '=' + byPid[i][0]);
                  r.sort(function (x, y) { return y[2] - x[2]; });
                  var out = [];
                  for (var i = 0; i < r.length && i < 5; i++) out.push(r[i][0] + ' (PID ' + r[i][1] + ')=' + r[i][2]);
                  return JSON.stringify({total: t, max: r.length ? r[0][2] : 0, top: out.join(', '), map: map.join('  ')});
          description: 'One pass over the process table feeds every handle item and the PID to name map. Win32_Process carries the process name, so the top list needs no lookup.'
          tags:
            - tag: component
              value: os
            - tag: scope
              value: capacity
        - uuid: cb4270630b77434eb73a912f5bf795ac
          name: 'Handles: total'
          key: winex.handles.total
          type: DEPENDENT
          value_type: UNSIGNED
          master_item:
            key: winex.proc.handles
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.total
          description: 'Watched by "Process probe: no data".'
          tags:
            - tag: component
              value: os
            - tag: scope
              value: capacity
        - uuid: 96ff7ea363194823b12847b1d61a509a
          name: 'Handles: busiest process'
          key: winex.handles.max
          type: DEPENDENT
          value_type: UNSIGNED
          master_item:
            key: winex.proc.handles
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.max
          tags:
            - tag: component
              value: os
            - tag: scope
              value: capacity
        - uuid: feea6d138f34481897fe8c1719b7c0ce
          name: 'Handles: top processes'
          key: winex.handles.top
          type: DEPENDENT
          value_type: TEXT
          master_item:
            key: winex.proc.handles
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.top
          description: 'Top five as "name (PID n)=count". Used in alert operational data.'
          tags:
            - tag: component
              value: os
            - tag: scope
              value: capacity
        - uuid: c03d145e49ad48259c12f10121a72ff1
          name: 'Processes: PID to name map'
          key: winex.proc.pidmap
          type: DEPENDENT
          history: 1d
          value_type: TEXT
          master_item:
            key: winex.proc.handles
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.map
          description: 'Sorted by PID, so the PIDs in a socket alert can be found by eye. Zabbix cannot join two master items, so socket alerts link here.'
          tags:
            - tag: component
              value: os
        - uuid: 7f380a61d7e64b9baff3a1d860503e67
          name: 'Windows events: local endpoint reused too fast (4227)'
          key: 'eventlog[System,,,,^4227$,,skip]'
          type: ZABBIX_ACTIVE
          delay: 1m
          history: 7d
          value_type: LOG
          description: |
            Event 4227: an outbound connection was refused because its local endpoint had recently been used for the
            same remote endpoint. Caused by one application reconnecting too often, not by an empty range.
            Collected apart from 4231 because {ITEM.LOG.EVENTID} resolves only in notifications, so one item carrying
            both could not say which event happened. A healthy host writes nothing here. eventlog[] works only as an
            active check.
          tags:
            - tag: component
              value: network
            - tag: scope
              value: capacity
        - uuid: 7723f063cc3d45a7b4e6b3ba81e31d89
          name: 'Windows events: dynamic port range exhausted (4231)'
          key: 'eventlog[System,,,,^4231$,,skip]'
          type: ZABBIX_ACTIVE
          delay: 1m
          history: 7d
          value_type: LOG
          description: |
            Event 4231: Windows could not allocate an ephemeral port because every port in the dynamic range is in
            use. It does not depend on the discovered range, so it fires even if the free-port count is wrong.
            A healthy host writes nothing here. eventlog[] works only as an active check.
          tags:
            - tag: component
              value: network
            - tag: scope
              value: capacity
        - uuid: 42f710a1775f4141a66cb30c2db9931f
          name: 'Memory: physical total'
          key: 'wmi.get[root\cimv2,"SELECT TotalPhysicalMemory FROM Win32_ComputerSystem"]'
          type: ZABBIX_ACTIVE
          delay: '{$WINEX.PROBE.INTERVAL}'
          timeout: '{$WINEX.WMI.TIMEOUT}'
          value_type: FLOAT
          units: B
          description: |
            Denominator of the kernel pool ratios. Read over WMI so that this template does not depend on an item
            of the stock template. Polled every probe interval although it does not change: on a newly linked host
            the ratios stay unsupported until the first value arrives.
          tags:
            - tag: component
              value: memory
        - uuid: b68b5130bd2845b1bbb06b154ddb3555
          name: 'Kernel pool: nonpaged, share of RAM'
          key: winex.pool.nonpaged.pct
          type: CALCULATED
          history: 7d
          params: '100*avg(//perf_counter_en["\Memory\Pool Nonpaged Bytes",60],5m)/last(//wmi.get[root\cimv2,"SELECT TotalPhysicalMemory FROM Win32_ComputerSystem"])'
          delay: 1m
          trends: '0'
          value_type: FLOAT
          units: '%'
          description: |
            Nonpaged pool as a share of physical memory, which bounds it on x64. A fixed byte ceiling is too tight
            on a large host and too loose on a very large one.
            The numerator is a 5-minute average: last() would keep returning the last reading of a stopped counter,
            while avg() over an empty window makes the item unsupported, and "Kernel pool ratio: no data" reports it.
            Trends are off because only min() and nodata() read this item.
          tags:
            - tag: component
              value: memory
            - tag: scope
              value: capacity
        - uuid: 99acf6617f2e43fcb755e66bc889a377
          name: 'Kernel pool: paged, share of RAM'
          key: winex.pool.paged.pct
          type: CALCULATED
          history: 7d
          params: '100*avg(//perf_counter_en["\Memory\Pool Paged Bytes",60],5m)/last(//wmi.get[root\cimv2,"SELECT TotalPhysicalMemory FROM Win32_ComputerSystem"])'
          delay: 1m
          trends: '0'
          value_type: FLOAT
          units: '%'
          description: 'Paged pool as a share of physical memory. Built like the nonpaged ratio. Paged pool differs more between server roles, so its ceiling is looser.'
          tags:
            - tag: component
              value: memory
            - tag: scope
              value: capacity
        - uuid: 2c7d8d456e014aceb4ec45375af616c9
          name: 'Kernel pool: nonpaged'
          key: 'perf_counter_en["\Memory\Pool Nonpaged Bytes",60]'
          type: ZABBIX_ACTIVE
          delay: 1m
          units: B
          description: 'The averaging parameter 60 keeps this key distinct from the one in the stock Windows template; without it the two templates cannot be linked to one host.'
          tags:
            - tag: component
              value: memory
            - tag: scope
              value: capacity
        - uuid: d82f7c3e89d54704a9fea2808d0e1e6b
          name: 'Kernel pool: paged'
          key: 'perf_counter_en["\Memory\Pool Paged Bytes",60]'
          type: ZABBIX_ACTIVE
          delay: 1m
          units: B
          description: |
            Carries the parameter 60 for the same reason as the nonpaged counter.
            Also the liveness witness of the no-data triggers: a 1-minute check that does not use WMI.
          tags:
            - tag: component
              value: memory
            - tag: scope
              value: capacity
      discovery_rules:
        - uuid: bf4f278194254ad7aa248a74cf018f27
          name: 'Dynamic port range discovery'
          key: winex.ports.range.discovery
          type: DEPENDENT
          lifetime: 7d
          master_item:
            key: 'wmi.getall[root\standardcimv2,"SELECT DynamicPortRangeStartPort,DynamicPortRangeNumberOfPorts FROM MSFT_NetTCPSetting WHERE SettingName=''Internet''"]'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var a = JSON.parse(value);
                  if (!a.length) throw 'MSFT_NetTCPSetting returned no Internet setting';
                  var start = Number(a[0].DynamicPortRangeStartPort);
                  var num = Number(a[0].DynamicPortRangeNumberOfPorts);
                  if (!(start > 0 && start < 65536 && num > 0 && start % 1 === 0 && num % 1 === 0
                        && start + num <= 65536)) {
                    throw 'implausible dynamic port range: start=' + start + ' num=' + num;
                  }
                  return JSON.stringify([{start: start, num: num}]);
          lld_macro_paths:
            - lld_macro: '{#PORT_NUM}'
              path: $.num
            - lld_macro: '{#PORT_START}'
              path: $.start
          description: |
            Discovers the dynamic port range from MSFT_NetTCPSetting and passes start and size to the free-port item
            and its triggers, so nothing has to be kept in step with netsh.
            A prototype key must contain a discovery macro, so the free-port item is keyed by the range. Changing the
            range creates a new item: its history starts over, the forecast needs six hours again, and the old item is
            disabled after 7 days.
            A row that fails the sanity check raises an error instead of discovering nothing, so the items already
            discovered stay in place.
          item_prototypes:
            - uuid: 57b80e59e6d946d688a0d7693bc4715e
              name: 'Ports: free in the dynamic range'
              key: 'winex.ports.eph.free[{#PORT_START},{#PORT_NUM}]'
              type: DEPENDENT
              value_type: UNSIGNED
              master_item:
                key: 'wmi.getall[root\standardcimv2,"SELECT State,OwningProcess FROM MSFT_NetTCPConnection"]'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      if (value.slice(-1) !== ']') throw 'truncated WMI payload, ' + value.length + ' bytes';
                      var a = JSON.parse(value), lo = {#PORT_START}, num = {#PORT_NUM}, hi = lo + num - 1;
                      var used = {};
                      for (var i = 0; i < a.length; i++) {
                        var lp = Number(String(a[i].InstanceID || '').split('++')[1]);
                        if (lp >= lo && lp <= hi) used[lp] = 1;
                      }
                      return num - Object.keys(used).length;
              description: |
                Free ports in the range Windows has. At zero, outbound connections fail.
                IPv4 and IPv6 ports are counted as one set, so the value is an upper bound. UDP and port reservations are
                not counted; keep a margin in {$WINEX.PORTS.FREE.PCT}.
                Parses the raw socket table again because the range filter needs individual rows.
              tags:
                - tag: component
                  value: network
                - tag: scope
                  value: capacity
          trigger_prototypes:
            - uuid: 9e79a5dfca644a16908b949aead20f6e
              expression: 'min(/Windows resource exhaustion by Zabbix agent active/winex.sock.time_wait,10m)>{#PORT_NUM}*{$WINEX.SOCK.TIMEWAIT.PCT}/100 and last(/Windows resource exhaustion by Zabbix agent active/winex.ports.eph.free[{#PORT_START},{#PORT_NUM}])>=0'
              name: 'Reconnect storm'
              event_name: '{ITEM.LASTVALUE1} sockets in TIME_WAIT on {HOST.NAME}, over {$WINEX.SOCK.TIMEWAIT.PCT}% of its {#PORT_NUM}-port range'
              priority: WARNING
              description: |
                TIME_WAIT sockets clear by themselves within minutes, but while they last they occupy ports of the dynamic
                range. The threshold is a share of the discovered range, so this trigger belongs to the discovery rule.
                A TIME_WAIT socket has no owner (OwningProcess 0), so no process is named.
                The last() on the free-port item exists because a trigger prototype must reference an item prototype.
              dependencies:
                - name: 'Port range probe: no data'
                  expression: 'nodata(/Windows resource exhaustion by Zabbix agent active/wmi.getall[root\standardcimv2,"SELECT DynamicPortRangeStartPort,DynamicPortRangeNumberOfPorts FROM MSFT_NetTCPSetting WHERE SettingName=''Internet''"],{$WINEX.NODATA.PERIOD})=1 and nodata(/Windows resource exhaustion by Zabbix agent active/wmi.getall[root\standardcimv2,"SELECT DynamicPortRangeStartPort,DynamicPortRangeNumberOfPorts FROM MSFT_NetTCPSetting WHERE SettingName=''Internet''"],30d)=0 and nodata(/Windows resource exhaustion by Zabbix agent active/perf_counter_en["\Memory\Pool Paged Bytes",60],5m)=0 and count(/Windows resource exhaustion by Zabbix agent active/perf_counter_en["\Memory\Pool Paged Bytes",60],{$WINEX.PROBE.INTERVAL}:now-{$WINEX.PROBE.INTERVAL})>0'
                - name: 'Socket probe: no data'

      tags:
        - tag: class
          value: os
        - tag: target
          value: windows
        - tag: vendor
          value: microsoft
      macros:
        - macro: '{$WINEX.HANDLES.CEILING}'
          value: '100000'
          description: 'Handles the busiest process may hold all day, measured as its 24-hour minimum. On the fleet the largest healthy minimum was a search indexer at 58000. Override it on a host with a legitimately large holder.'
        - macro: '{$WINEX.NODATA.PERIOD}'
          value: 15m
          description: 'How long a probe may stay silent before its no-data trigger fires. At least three times {$WINEX.PROBE.INTERVAL}.'
        - macro: '{$WINEX.POOL.NONPAGED.PCT}'
          value: '20'
          description: 'Nonpaged pool ceiling, percent of physical memory. Healthy hosts on the fleet sat between 0.2 and 6.4 percent.'
        - macro: '{$WINEX.POOL.PAGED.PCT}'
          value: '15'
          description: 'Paged pool ceiling, percent of physical memory. The fleet median is 3.5 percent; the worst real case reached 30 percent.'
        - macro: '{$WINEX.PORTS.FREE.PCT}'
          value: '12'
          description: 'Minimum free ports, percent of the discovered dynamic range.'
        - macro: '{$WINEX.PORTS.TIMELEFT}'
          value: 1d
          description: 'How far ahead the port forecast looks.'
        - macro: '{$WINEX.PROBE.INTERVAL}'
          value: 5m
          description: 'Polling interval of the four WMI probes. Also the look-back of the liveness check in the no-data triggers.'
        - macro: '{$WINEX.SOCK.BOUND.FLOOR}'
          value: '500'
          description: 'Bound sockets a host must hold for an hour before the port forecast may fire.'
        - macro: '{$WINEX.SOCK.CLOSEWAIT.MAX}'
          value: '200'
          description: 'CLOSE_WAIT sockets on the host, held for 15 minutes.'
        - macro: '{$WINEX.SOCK.TIMEWAIT.PCT}'
          value: '25'
          description: 'TIME_WAIT sockets, percent of the discovered dynamic range.'
        - macro: '{$WINEX.WMI.TIMEOUT}'
          value: 30s
          description: 'Timeout of the WMI probes. 30s is the Zabbix maximum.'
  triggers:
    - uuid: ce84ff442dff481eadf155ef88310bcb
      expression: 'nodata(/Windows resource exhaustion by Zabbix agent active/winex.sock.total,{$WINEX.NODATA.PERIOD})=1 and nodata(/Windows resource exhaustion by Zabbix agent active/winex.sock.total,30d)=0 and nodata(/Windows resource exhaustion by Zabbix agent active/perf_counter_en["\Memory\Pool Paged Bytes",60],5m)=0 and count(/Windows resource exhaustion by Zabbix agent active/perf_counter_en["\Memory\Pool Paged Bytes",60],{$WINEX.PROBE.INTERVAL}:now-{$WINEX.PROBE.INTERVAL})>0'
      name: 'Socket probe: no data'
      event_name: 'Socket probe on {HOST.NAME} has been silent for {$WINEX.NODATA.PERIOD}'
      opdata: 'last seen: {ITEM.LASTVALUE1} sockets'
      priority: WARNING
      description: |
        The MSFT_NetTCPConnection probe stopped while the agent is alive: a WMI timeout, or a payload rejected
        as truncated. Each probe has its own no-data trigger, so a stalled socket query does not hide handle or
        pool alerts whose data still arrives.
        Fires only if the 1-minute kernel pool counter reported within the last 5 minutes and also one probe
        interval earlier. When the agent, proxy or link is down, the counter stops as well and nothing fires; the
        stock template reports that. The second check covers recovery: the counter returns about a minute after
        the agent starts, the probe up to one interval later.
        nodata(...,30d)=0 means the probe has reported at least once. It still evaluates when the item is
        unsupported, unlike last(), and on a newly linked host it keeps the trigger quiet.
        Replayed over 31 days on 38 hosts: two firings, both a real WMI stall.
      tags:
        - tag: component
          value: network
        - tag: scope
          value: availability
    - uuid: d6ee90082baa4011baa0f57624b46713
      expression: 'nodata(/Windows resource exhaustion by Zabbix agent active/winex.handles.total,{$WINEX.NODATA.PERIOD})=1 and nodata(/Windows resource exhaustion by Zabbix agent active/winex.handles.total,30d)=0 and nodata(/Windows resource exhaustion by Zabbix agent active/perf_counter_en["\Memory\Pool Paged Bytes",60],5m)=0 and count(/Windows resource exhaustion by Zabbix agent active/perf_counter_en["\Memory\Pool Paged Bytes",60],{$WINEX.PROBE.INTERVAL}:now-{$WINEX.PROBE.INTERVAL})>0'
      name: 'Process probe: no data'
      event_name: 'Process probe on {HOST.NAME} has been silent for {$WINEX.NODATA.PERIOD}'
      opdata: 'last seen: {ITEM.LASTVALUE1} handles'
      priority: WARNING
      description: |
        The Win32_Process probe stopped while the agent is alive. Same conditions as "Socket probe: no data".
        The process query fails independently of the socket query, so neither is the other's parent.
      tags:
        - tag: component
          value: os
        - tag: scope
          value: availability
    - uuid: ae13b0bc20df4b459613f94a41566ca2
      expression: '(nodata(/Windows resource exhaustion by Zabbix agent active/perf_counter_en["\Memory\Pool Nonpaged Bytes",60],{$WINEX.NODATA.PERIOD})=1 or nodata(/Windows resource exhaustion by Zabbix agent active/perf_counter_en["\Memory\Pool Paged Bytes",60],{$WINEX.NODATA.PERIOD})=1) and nodata(/Windows resource exhaustion by Zabbix agent active/perf_counter_en["\Memory\Pool Nonpaged Bytes",60],30d)=0 and nodata(/Windows resource exhaustion by Zabbix agent active/perf_counter_en["\Memory\Pool Paged Bytes",60],30d)=0 and nodata(/Windows resource exhaustion by Zabbix agent active/wmi.get[root\cimv2,"SELECT TotalPhysicalMemory FROM Win32_ComputerSystem"],{$WINEX.NODATA.PERIOD})=0 and count(/Windows resource exhaustion by Zabbix agent active/wmi.get[root\cimv2,"SELECT TotalPhysicalMemory FROM Win32_ComputerSystem"],{$WINEX.NODATA.PERIOD}:now-{$WINEX.NODATA.PERIOD})>0'
      name: 'Kernel pool: no data'
      event_name: 'Kernel pool counters on {HOST.NAME} have been silent for {$WINEX.NODATA.PERIOD}'
      opdata: 'last seen: nonpaged {ITEM.LASTVALUE1}, paged {ITEM.LASTVALUE2}'
      priority: WARNING
      description: |
        The kernel pool counters stopped while the agent is alive, for example after the perf counter registry
        was damaged. The paged-pool counter is the liveness witness of every other no-data trigger, so this one
        is armed by the WMI memory reading instead: it must have arrived within {$WINEX.NODATA.PERIOD} and one
        period earlier.
      tags:
        - tag: component
          value: memory
        - tag: scope
          value: availability
    - uuid: 83257a589f9843d088f75fa5150bfabf
      expression: '(nodata(/Windows resource exhaustion by Zabbix agent active/winex.pool.nonpaged.pct,{$WINEX.NODATA.PERIOD})=1 or nodata(/Windows resource exhaustion by Zabbix agent active/winex.pool.paged.pct,{$WINEX.NODATA.PERIOD})=1 or nodata(/Windows resource exhaustion by Zabbix agent active/wmi.get[root\cimv2,"SELECT TotalPhysicalMemory FROM Win32_ComputerSystem"],{$WINEX.NODATA.PERIOD})=1) and nodata(/Windows resource exhaustion by Zabbix agent active/winex.pool.nonpaged.pct,30d)=0 and nodata(/Windows resource exhaustion by Zabbix agent active/winex.pool.paged.pct,30d)=0 and nodata(/Windows resource exhaustion by Zabbix agent active/wmi.get[root\cimv2,"SELECT TotalPhysicalMemory FROM Win32_ComputerSystem"],30d)=0 and nodata(/Windows resource exhaustion by Zabbix agent active/perf_counter_en["\Memory\Pool Paged Bytes",60],5m)=0 and count(/Windows resource exhaustion by Zabbix agent active/perf_counter_en["\Memory\Pool Paged Bytes",60],{$WINEX.PROBE.INTERVAL}:now-{$WINEX.PROBE.INTERVAL})>0'
      name: 'Kernel pool ratio: no data'
      event_name: 'Kernel pool ratios on {HOST.NAME} cannot be computed'
      opdata: 'last seen: nonpaged {ITEM.LASTVALUE1} of RAM, paged {ITEM.LASTVALUE2} of RAM'
      priority: WARNING
      description: |
        The pool ceilings need a counter and the memory reading. This fires when the ratios or the memory query
        stop while the agent is alive, for example when the WMI memory query times out.
        Depends on "Kernel pool: no data": when the counters themselves stop, that trigger names the cause.
      dependencies:
        - name: 'Kernel pool: no data'
          expression: '(nodata(/Windows resource exhaustion by Zabbix agent active/perf_counter_en["\Memory\Pool Nonpaged Bytes",60],{$WINEX.NODATA.PERIOD})=1 or nodata(/Windows resource exhaustion by Zabbix agent active/perf_counter_en["\Memory\Pool Paged Bytes",60],{$WINEX.NODATA.PERIOD})=1) and nodata(/Windows resource exhaustion by Zabbix agent active/perf_counter_en["\Memory\Pool Nonpaged Bytes",60],30d)=0 and nodata(/Windows resource exhaustion by Zabbix agent active/perf_counter_en["\Memory\Pool Paged Bytes",60],30d)=0 and nodata(/Windows resource exhaustion by Zabbix agent active/wmi.get[root\cimv2,"SELECT TotalPhysicalMemory FROM Win32_ComputerSystem"],{$WINEX.NODATA.PERIOD})=0 and count(/Windows resource exhaustion by Zabbix agent active/wmi.get[root\cimv2,"SELECT TotalPhysicalMemory FROM Win32_ComputerSystem"],{$WINEX.NODATA.PERIOD}:now-{$WINEX.NODATA.PERIOD})>0'
      tags:
        - tag: component
          value: memory
        - tag: scope
          value: availability
    - uuid: 67e59281c9d84fca9138afdc78ad4f9b
      expression: 'nodata(/Windows resource exhaustion by Zabbix agent active/wmi.getall[root\standardcimv2,"SELECT DynamicPortRangeStartPort,DynamicPortRangeNumberOfPorts FROM MSFT_NetTCPSetting WHERE SettingName=''Internet''"],{$WINEX.NODATA.PERIOD})=1 and nodata(/Windows resource exhaustion by Zabbix agent active/wmi.getall[root\standardcimv2,"SELECT DynamicPortRangeStartPort,DynamicPortRangeNumberOfPorts FROM MSFT_NetTCPSetting WHERE SettingName=''Internet''"],30d)=0 and nodata(/Windows resource exhaustion by Zabbix agent active/perf_counter_en["\Memory\Pool Paged Bytes",60],5m)=0 and count(/Windows resource exhaustion by Zabbix agent active/perf_counter_en["\Memory\Pool Paged Bytes",60],{$WINEX.PROBE.INTERVAL}:now-{$WINEX.PROBE.INTERVAL})>0'
      name: 'Port range probe: no data'
      event_name: 'Dynamic port range on {HOST.NAME} has not been measured for {$WINEX.NODATA.PERIOD}'
      opdata: 'range last seen: {{ITEM.LASTVALUE1}.regsub("StartPort[^0-9]+([0-9]+)", \1)} + {{ITEM.LASTVALUE1}.regsub("NumberOfPorts[^0-9]+([0-9]+)", \1)} ports'
      priority: WARNING
      description: |
        The MSFT_NetTCPSetting probe stopped while the agent is alive. Without it the discovered range stays as
        it was, and a range changed with netsh is never picked up. Same conditions as "Socket probe: no data".
      tags:
        - tag: component
          value: network
        - tag: scope
          value: availability
    - uuid: fc3c401634b0424c8d137538b54a4fa4
      expression: 'count(/Windows resource exhaustion by Zabbix agent active/eventlog[System,,,,^4231$,,skip],30m)>0'
      recovery_mode: RECOVERY_EXPRESSION
      recovery_expression: 'nodata(/Windows resource exhaustion by Zabbix agent active/eventlog[System,,,,^4231$,,skip],1h)=1'
      name: 'Windows confirms the dynamic port range is exhausted'
      event_name: 'Windows on {HOST.NAME} could not allocate an ephemeral port (event 4231)'
      priority: HIGH
      description: |
        Event 4231 (Tcpip): "A request to allocate an ephemeral port number from the global TCP port space has
        failed due to all such ports being in use." New outbound connections fail now.
        The free-port and forecast triggers fire earlier; this one confirms the failure and does not name a
        process. Until 1.5.0 it read event 4227 by mistake and fired 28 times on hosts that used at most 508 of
        16384 ports.
        Recovers after an hour without new events: count() alone would keep the problem open, because an
        event-log item gets values only during an incident.
      tags:
        - tag: component
          value: network
        - tag: scope
          value: capacity
    - uuid: 1c0ea932ec8442f6aac7638ee1d34c2f
      expression: 'count(/Windows resource exhaustion by Zabbix agent active/eventlog[System,,,,^4227$,,skip],30m)>0'
      recovery_mode: RECOVERY_EXPRESSION
      recovery_expression: 'nodata(/Windows resource exhaustion by Zabbix agent active/eventlog[System,,,,^4227$,,skip],1h)=1'
      name: 'Local endpoint reused faster than TIME_WAIT drains'
      event_name: 'Windows on {HOST.NAME} refused an outbound connection reusing a recent local endpoint (event 4227)'
      priority: WARNING
      description: |
        Event 4227 (Tcpip): "TCP/IP failed to establish an outgoing connection because the selected local
        endpoint was recently used to connect to the same remote endpoint." One application opens and closes
        connections to one address faster than TIME_WAIT clears. The range is usually far from full, so widening
        it with netsh does not help; the application has to reuse connections.
        Recovers after an hour without new events, like the 4231 trigger.
      tags:
        - tag: component
          value: network
        - tag: scope
          value: capacity
    - uuid: 361ed86a3ddd49ae907871108c4fcc62
      expression: 'min(/Windows resource exhaustion by Zabbix agent active/winex.sock.close_wait,15m)>{$WINEX.SOCK.CLOSEWAIT.MAX} and length(last(/Windows resource exhaustion by Zabbix agent active/winex.sock.close_wait.top))>0'
      name: 'Connections are not being closed'
      event_name: '{ITEM.LASTVALUE1} sockets stuck in CLOSE_WAIT on {HOST.NAME}'
      opdata: 'top: {{ITEM.LASTVALUE2}.regsub("(.*)", \1)}'
      priority: WARNING
      description: |
        CLOSE_WAIT sockets pile up when the local application never calls close() on a socket the peer already
        closed. The operational data names the PID.
        While the socket probe is silent the trigger keeps its state, and "Socket probe: no data" reports the gap.
      dependencies:
        - name: 'Socket probe: no data'
          expression: 'nodata(/Windows resource exhaustion by Zabbix agent active/winex.sock.total,{$WINEX.NODATA.PERIOD})=1 and nodata(/Windows resource exhaustion by Zabbix agent active/winex.sock.total,30d)=0 and nodata(/Windows resource exhaustion by Zabbix agent active/perf_counter_en["\Memory\Pool Paged Bytes",60],5m)=0 and count(/Windows resource exhaustion by Zabbix agent active/perf_counter_en["\Memory\Pool Paged Bytes",60],{$WINEX.PROBE.INTERVAL}:now-{$WINEX.PROBE.INTERVAL})>0'
      url_name: 'PID to name map'
      url: 'zabbix.php?action=latest.view&hostids%5B%5D={HOST.ID}&name=PID+to+name&filter_set=1'
      tags:
        - tag: component
          value: network
        - tag: scope
          value: capacity
    - uuid: 4a9d61c0f7b84e2ea3d5b8091c6e7f34
      expression: 'min(/Windows resource exhaustion by Zabbix agent active/winex.handles.max,24h)>{$WINEX.HANDLES.CEILING} and length(last(/Windows resource exhaustion by Zabbix agent active/winex.handles.top))>0'
      name: 'Handles in one process are above the ceiling'
      event_name: '{{ITEM.LASTVALUE2}.regsub("^(.*?) \(PID", \1)} on {HOST.NAME} holds {ITEM.LASTVALUE1} handles'
      opdata: 'now {ITEM.LASTVALUE1}, top: {{ITEM.LASTVALUE2}.regsub("(.*)", \1)}'
      priority: AVERAGE
      url_name: 'Handle items on this host'
      url: 'zabbix.php?action=latest.view&hostids%5B%5D={HOST.ID}&name=Handles&filter_set=1'
      description: |
        The busiest process held more than {$WINEX.HANDLES.CEILING} handles all day: the trigger reads the
        24-hour minimum, so daily peaks are not reported.
        The ceiling is not a Windows limit; the per-process limit is 16777216. The largest holder differs from
        host to host (svchost, lsass, a search indexer), so where a host legitimately runs a large one, override
        {$WINEX.HANDLES.CEILING} on that host.
        Average, not High: a standing count calls for a planned restart. Before restarting, look at the kernel
        pool items: kernel memory runs out first.
        The event name keeps the count from the moment the problem opened; the operational data shows the
        current one.
      dependencies:
        - name: 'Process probe: no data'
          expression: 'nodata(/Windows resource exhaustion by Zabbix agent active/winex.handles.total,{$WINEX.NODATA.PERIOD})=1 and nodata(/Windows resource exhaustion by Zabbix agent active/winex.handles.total,30d)=0 and nodata(/Windows resource exhaustion by Zabbix agent active/perf_counter_en["\Memory\Pool Paged Bytes",60],5m)=0 and count(/Windows resource exhaustion by Zabbix agent active/perf_counter_en["\Memory\Pool Paged Bytes",60],{$WINEX.PROBE.INTERVAL}:now-{$WINEX.PROBE.INTERVAL})>0'
      tags:
        - tag: process
          value: '{{ITEM.VALUE2}.regsub("^(.*?) \(PID", \1)}'
        - tag: component
          value: os
        - tag: scope
          value: capacity
    - uuid: 8b30fefdb48241e5a3f71075bcfa8c7b
      expression: 'min(/Windows resource exhaustion by Zabbix agent active/winex.pool.nonpaged.pct,10m)>{$WINEX.POOL.NONPAGED.PCT} and last(/Windows resource exhaustion by Zabbix agent active/perf_counter_en["\Memory\Pool Nonpaged Bytes",60])>=0'
      name: 'Nonpaged pool above the ceiling'
      event_name: 'Nonpaged pool on {HOST.NAME} is {ITEM.LASTVALUE1} of RAM'
      opdata: 'nonpaged pool now: {ITEM.LASTVALUE2}'
      priority: HIGH
      description: |
        The ceiling is a share of physical memory, which bounds the nonpaged pool on x64.
        Nonpaged pool exhaustion stops the whole machine.
        The last() on the byte counter brings it into the expression for the operational data.
      dependencies:
        - name: 'Kernel pool ratio: no data'
          expression: '(nodata(/Windows resource exhaustion by Zabbix agent active/winex.pool.nonpaged.pct,{$WINEX.NODATA.PERIOD})=1 or nodata(/Windows resource exhaustion by Zabbix agent active/winex.pool.paged.pct,{$WINEX.NODATA.PERIOD})=1 or nodata(/Windows resource exhaustion by Zabbix agent active/wmi.get[root\cimv2,"SELECT TotalPhysicalMemory FROM Win32_ComputerSystem"],{$WINEX.NODATA.PERIOD})=1) and nodata(/Windows resource exhaustion by Zabbix agent active/winex.pool.nonpaged.pct,30d)=0 and nodata(/Windows resource exhaustion by Zabbix agent active/winex.pool.paged.pct,30d)=0 and nodata(/Windows resource exhaustion by Zabbix agent active/wmi.get[root\cimv2,"SELECT TotalPhysicalMemory FROM Win32_ComputerSystem"],30d)=0 and nodata(/Windows resource exhaustion by Zabbix agent active/perf_counter_en["\Memory\Pool Paged Bytes",60],5m)=0 and count(/Windows resource exhaustion by Zabbix agent active/perf_counter_en["\Memory\Pool Paged Bytes",60],{$WINEX.PROBE.INTERVAL}:now-{$WINEX.PROBE.INTERVAL})>0'
      tags:
        - tag: component
          value: memory
        - tag: scope
          value: capacity
    - uuid: 6b5869e9585f49a18ac50c4531299b4b
      expression: 'min(/Windows resource exhaustion by Zabbix agent active/winex.pool.paged.pct,10m)>{$WINEX.POOL.PAGED.PCT} and last(/Windows resource exhaustion by Zabbix agent active/perf_counter_en["\Memory\Pool Paged Bytes",60])>=0'
      name: 'Paged pool above the ceiling'
      event_name: 'Paged pool on {HOST.NAME} is {ITEM.LASTVALUE1} of RAM'
      opdata: 'paged pool now: {ITEM.LASTVALUE2}'
      priority: HIGH
      description: |
        Paged pool exhaustion shows up as failures to create handles, registry keys and desktop heaps.
        The ceiling is a share of memory, looser than the nonpaged one because paged pool differs more between
        roles. The last() on the byte counter brings it into the expression for the operational data.
